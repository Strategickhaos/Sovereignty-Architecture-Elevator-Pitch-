tools:
  order: ["core-tools", "security-tools", "ops-tools", "network-tools"]  # Category order
  
  core-tools:
    icon: "🛠️"  # Category icon
    description: "Core System Utilities"
    items:
      - name: "Git"
        icon: "📂"  # Item icon
        command: "git --version"
        description: "Version control system"
      - name: "Docker"
        icon: "🐳"
        command: "docker --version"
        description: "Container platform"
      - name: "Kubernetes"
        icon: "☸️"
        command: "kubectl version --client"
        description: "Container orchestration"
      - name: "Python"
        icon: "🐍"
        command: "python3 --version"
        description: "Python interpreter"
      - name: "Node.js"
        icon: "🟢"
        command: "node --version"
        description: "JavaScript runtime"
  
  security-tools:
    icon: "🔒"
    description: "Security & Penetration Testing"
    items:
      - name: "Nmap"
        icon: "🔍"
        command: "nmap --version"
        description: "Network scanner"
      - name: "Metasploit"
        icon: "🎯"
        command: "msfconsole --version"
        description: "Exploitation framework"
      - name: "Wireshark"
        icon: "🦈"
        command: "wireshark --version"
        description: "Network protocol analyzer"
      - name: "Burp Suite"
        icon: "🔓"
        command: "echo 'Burp Suite Community Edition'"
        description: "Web security testing"
      - name: "SQLMap"
        icon: "💉"
        command: "sqlmap --version"
        description: "SQL injection tool"
  
  ops-tools:
    icon: "⚙️"
    description: "DevOps & Operations"
    items:
      - name: "Terraform"
        icon: "🏗️"
        command: "terraform --version"
        description: "Infrastructure as Code"
      - name: "Ansible"
        icon: "🤖"
        command: "ansible --version"
        description: "Configuration management"
      - name: "Jenkins"
        icon: "🔧"
        command: "echo 'Jenkins CI/CD Pipeline'"
        description: "Automation server"
      - name: "Prometheus"
        icon: "📊"
        command: "echo 'Prometheus Monitoring'"
        description: "Monitoring system"
      - name: "Grafana"
        icon: "📈"
        command: "echo 'Grafana Dashboard'"
        description: "Analytics platform"
  
  network-tools:
    icon: "🌐"
    description: "Network Utilities"
    items:
      - name: "Netcat"
        icon: "🐱"
        command: "nc -h 2>&1 | head -5"
        description: "Network utility"
      - name: "TCPDump"
        icon: "📡"
        command: "tcpdump --version"
        description: "Packet analyzer"
      - name: "Curl"
        icon: "🌊"
        command: "curl --version | head -1"
        description: "HTTP client"
      - name: "Wget"
        icon: "⬇️"
        command: "wget --version | head -1"
        description: "File downloader"
      - name: "SSH"
        icon: "🔐"
        command: "ssh -V"
        description: "Secure shell"
