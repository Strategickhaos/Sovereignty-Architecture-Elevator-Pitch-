      interpretation: |
        Quantum fitness with:
        - D_q = 1 - ⟨ψ|ρ|ψ⟩ (fidelity loss)
        - N_q = gate error rate
        - eq_q = 1 - Tr|ψ - ψ_target| (trace distance)
      
