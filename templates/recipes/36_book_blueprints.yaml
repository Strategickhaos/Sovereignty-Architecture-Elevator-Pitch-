    category: "paper"
    materials:
      primary: "Reed pith (Cyperus papyrus)"
      secondary: "Water"
    process:
      - "Harvest fresh reed stems"
      - "Cut into strips lengthwise"
      - "Layer strips horizontally"
      - "Layer second set vertically (cross-grain)"
      - "Hammer together to release natural sugars"
      - "Press under weight"
      - "Dry in sun 3-7 days"
    trig6:
      theta: "π/4"
      theta_numeric: 0.785398
      interpretation: "Balanced transformation"
      stability: "high"
      danger_zone: "θ > π/2 → over-dried, brittle"
    properties:
      durability: "1000+ years in dry climate"
      flexibility: "medium"
      archival_quality: "excellent"
