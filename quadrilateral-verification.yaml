# Quadrilateral Verification Protocol
# Sovereign Cognitive Architecture
# Version: 1.0.0

metadata:
  title: "Quadrilateral Verification Protocol"
  description: "Multi-modal truth validation across four cognitive dimensions"
  version: "1.0.0"
  last_updated: "2025-12-07"
  principle: "Trust nothing until it survives 100-angle crossfire"

# ============================================================================
# CORE PHILOSOPHY
# ============================================================================

philosophy:
  summary: |
    The Quadrilateral Verification Protocol validates every insight through
    FOUR independent cognitive dimensions. Only claims that pass 3/4 or 4/4
    dimensions are accepted as truth.
    
  inspiration: |
    Human understanding occurs across multiple modalities:
    - SYMBOLIC: Logic and code (left brain)
    - SPATIAL: Visual and structural (right brain)
    - NARRATIVE: Story and explanation (language center)
    - KINETIC: Action and execution (motor cortex)
    
    By requiring validation across all four, we collapse to truth.
    
  benefit: |
    - Catches logical errors that sound good narratively
    - Catches vague narratives that fail spatial visualization
    - Catches beautiful diagrams that don't execute
    - Catches working code that lacks coherent explanation

# ============================================================================
# THE FOUR DIMENSIONS
# ============================================================================

dimensions:
  symbolic:
    name: "SYMBOLIC"
    aka: ["Logic", "Code", "Formal"]
    description: "Does it compute? Is the logic sound?"
    
    validation_methods:
      - "Formal logic proof"
      - "Code syntax checking"
      - "Type verification"
      - "Mathematical proof"
      - "Logical consistency check"
      
    validators:
      llms:
        - provider: "claude"
          priority: 1
          strengths: ["code_analysis", "reasoning"]
        - provider: "gpt"
          priority: 2
          strengths: ["logic_checking", "formal_verification"]
      tools:
        - "type_checker"
        - "linter"
        - "theorem_prover"
        
    test_type: "logical_proof"
    weight: 1.0
    timeout_seconds: 30
    
    pass_criteria:
      - "No logical contradictions"
      - "Valid formal structure"
      - "Code compiles/parses correctly"
      - "Type system satisfied"
      
    example_tests:
      code: |
        # Test: Does this function have correct logic?
        def fibonacci(n):
            if n <= 1:
                return n
            return fibonacci(n-1) + fibonacci(n-2)
        
        # Symbolic validation:
        # ✅ Base case defined (n <= 1)
        # ✅ Recursive case correct (n-1 + n-2)
        # ✅ Termination guaranteed (n decreasing)
        
      logic: |
        # Test: Is this statement logically valid?
        Claim: "If all A are B, and all B are C, then all A are C"
        
        # Symbolic validation:
        # ✅ Valid syllogism (Barbara form)
        # ✅ Transitive property holds
        # ✅ No logical fallacies

  spatial:
    name: "SPATIAL"
    aka: ["Visual", "Diagram", "Structural"]
    description: "Can you draw it? Is the structure clear?"
    
    validation_methods:
      - "Generate diagram/flowchart"
      - "Visualize architecture"
      - "Map relationships"
      - "Draw data flow"
      - "Create mental model"
      
    validators:
      llms:
        - provider: "claude"
          priority: 1
          strengths: ["diagram_generation", "ascii_art"]
        - provider: "gpt"
          priority: 2
          strengths: ["vision", "mermaid_diagrams"]
      tools:
        - "mermaid_renderer"
        - "graphviz"
        - "plantuml"
        
    test_type: "diagram_generation"
    weight: 1.0
    timeout_seconds: 45
    
    pass_criteria:
      - "Clear visual representation possible"
      - "Relationships explicitly shown"
      - "No ambiguous connections"
      - "Spatial layout makes sense"
      
    example_tests:
      architecture: |
        # Test: Can you diagram this system?
        System: "Memory Mesh with 3 LLMs connecting to Qdrant"
        
        # Spatial validation (Mermaid):
        graph TD
          A[Claude] --> D[Memory Mesh]
          B[GPT] --> D
          C[Ollama] --> D
          D --> E[Qdrant]
          D --> F[Redis]
        
        # ✅ Clear hierarchy
        # ✅ All connections shown
        # ✅ Direction unambiguous
        
      algorithm: |
        # Test: Visualize merge sort
        
        # Spatial validation (ASCII):
        [8,3,5,1] → Split → [8,3] [5,1]
                    ↓              ↓
                  [8][3]        [5][1]
                    ↓              ↓
                  [3,8]          [1,5]
                    ↓              ↓
                     [1,3,5,8] ← Merge
        
        # ✅ Recursion visible
        # ✅ Merge operation clear
        # ✅ Data flow obvious

  narrative:
    name: "NARRATIVE"
    aka: ["Story", "Explanation", "Natural Language"]
    description: "Can you tell it? Does it make human sense?"
    
    validation_methods:
      - "Generate explanation"
      - "Tell the story"
      - "Explain like I'm 5"
      - "Write documentation"
      - "Create tutorial"
      
    validators:
      llms:
        - provider: "claude"
          priority: 1
          strengths: ["clear_explanations", "teaching"]
        - provider: "gpt"
          priority: 2
          strengths: ["storytelling", "analogies"]
        - provider: "ollama"
          priority: 3
          strengths: ["local_validation", "diverse_perspectives"]
      tools:
        - "readability_checker"
        - "grammar_validator"
        
    test_type: "explanation_clarity"
    weight: 1.0
    timeout_seconds: 30
    
    pass_criteria:
      - "Clear natural language explanation"
      - "No jargon without definition"
      - "Logical flow of ideas"
      - "Understandable to target audience"
      - "Consistent terminology"
      
    example_tests:
      concept: |
        # Test: Explain quantum superposition
        
        # Narrative validation:
        "A quantum particle can exist in multiple states simultaneously,
        like a coin spinning in the air being both heads and tails at once.
        Only when we measure it does it 'collapse' to a single state."
        
        # ✅ Uses accessible analogy (spinning coin)
        # ✅ Key concept (superposition) defined
        # ✅ Consequence (measurement) explained
        # ✅ No undefined jargon
        
      algorithm: |
        # Test: Explain binary search
        
        # Narrative validation:
        "Binary search finds an item in a sorted list by repeatedly halving
        the search space. Start in the middle. If the target is smaller,
        search the left half. If larger, search the right half. Repeat
        until found or space exhausted."
        
        # ✅ Clear step-by-step process
        # ✅ Prerequisites stated (sorted list)
        # ✅ Decision points explained
        # ✅ Termination conditions given

  kinetic:
    name: "KINETIC"
    aka: ["Action", "Execution", "Practical"]
    description: "Can you run it? Does it work in practice?"
    
    validation_methods:
      - "Execute code"
      - "Run tests"
      - "Perform action"
      - "Deploy system"
      - "Measure results"
      
    validators:
      executors:
        - executor: "python_sandbox"
          priority: 1
          languages: ["python"]
        - executor: "node_sandbox"
          priority: 2
          languages: ["javascript", "typescript"]
        - executor: "docker_sandbox"
          priority: 3
          languages: ["any"]
      tools:
        - "pytest"
        - "jest"
        - "docker"
        
    test_type: "practical_execution"
    weight: 1.0
    timeout_seconds: 60
    sandboxed: true
    
    pass_criteria:
      - "Code executes without errors"
      - "Output matches expected"
      - "Performance acceptable"
      - "Side effects as intended"
      - "Tests pass"
      
    example_tests:
      code: |
        # Test: Execute fibonacci function
        
        def fibonacci(n):
            if n <= 1:
                return n
            return fibonacci(n-1) + fibonacci(n-2)
        
        # Kinetic validation:
        assert fibonacci(0) == 0  # ✅
        assert fibonacci(1) == 1  # ✅
        assert fibonacci(5) == 5  # ✅
        assert fibonacci(10) == 55  # ✅
        
      system: |
        # Test: Deploy Docker container
        
        # Kinetic validation:
        $ docker build -t test .
        # ✅ Build succeeds
        
        $ docker run -p 8000:8000 test
        # ✅ Container starts
        
        $ curl http://localhost:8000/health
        # ✅ Returns {"status": "healthy"}

# ============================================================================
# VERIFICATION FLOW
# ============================================================================

verification_flow:
  input:
    claim:
      type: "string"
      description: "The statement, code, or system to verify"
    context:
      type: "object"
      optional: true
      description: "Additional context for verification"
      
  process:
    steps:
      - step: 1
        name: "Initialize Verification"
        action: "Create verification session with unique ID"
        
      - step: 2
        name: "Symbolic Verification"
        action: "Submit claim to symbolic validators"
        parallel: true
        validators: ["claude", "gpt", "type_checker"]
        
      - step: 3
        name: "Spatial Verification"
        action: "Generate diagram/visualization"
        parallel: true
        validators: ["claude", "gpt", "mermaid_renderer"]
        
      - step: 4
        name: "Narrative Verification"
        action: "Request natural language explanation"
        parallel: true
        validators: ["claude", "gpt", "ollama"]
        
      - step: 5
        name: "Kinetic Verification"
        action: "Execute in sandboxed environment"
        parallel: false  # Must be sequential for safety
        validators: ["code_sandbox"]
        
      - step: 6
        name: "Calculate Consensus"
        action: "Aggregate votes and determine verdict"
        
      - step: 7
        name: "Log Audit Trail"
        action: "Record all votes, reasoning, and final decision"
        
  output:
    verification_result:
      claim_id: "string"
      timestamp: "datetime"
      dimensions:
        symbolic:
          pass: "boolean"
          validator: "string"
          reasoning: "string"
          confidence: "float"
        spatial:
          pass: "boolean"
          validator: "string"
          diagram: "string"  # URL or embedded
          confidence: "float"
        narrative:
          pass: "boolean"
          validator: "string"
          explanation: "string"
          confidence: "float"
        kinetic:
          pass: "boolean"
          executor: "string"
          output: "string"
          confidence: "float"
      consensus:
        votes: "string"  # e.g., "4/4", "3/4"
        verdict: "string"  # TRUTH | PROBABLE | UNCERTAIN | REJECT
        confidence: "float"
      audit_trail:
        session_id: "string"
        duration_ms: "integer"
        validator_details: "array"

# ============================================================================
# CONSENSUS ALGORITHM
# ============================================================================

consensus:
  voting:
    method: "weighted_majority"
    weights:
      symbolic: 1.0
      spatial: 1.0
      narrative: 1.0
      kinetic: 1.0
      
  thresholds:
    truth:
      votes_required: 4
      description: "All 4 dimensions pass"
      confidence_threshold: 0.9
      verdict: "TRUTH ✅"
      action: "Accept claim"
      
    probable:
      votes_required: 3
      description: "3 dimensions pass"
      confidence_threshold: 0.75
      verdict: "PROBABLE 🟡"
      action: "Accept with caution, log dissent"
      
    uncertain:
      votes_required: 2
      description: "2 dimensions pass"
      confidence_threshold: 0.5
      verdict: "UNCERTAIN 🟠"
      action: "Flag for human review"
      
    reject:
      votes_required: "0-1"
      description: "0-1 dimensions pass"
      confidence_threshold: 0.25
      verdict: "REJECT ❌"
      action: "Reject claim, log failure reasons"
      
  tie_breaking:
    method: "human_review"
    escalation_threshold: "2/4 votes"
    timeout_human_review: "24 hours"
    default_on_timeout: "UNCERTAIN"

# ============================================================================
# AUDIT TRAIL
# ============================================================================

audit:
  enabled: true
  storage: "permanent"
  
  record_structure:
    verification_id: "uuid"
    timestamp: "datetime"
    claim: "string"
    context: "object"
    
    dimension_votes:
      symbolic:
        validators: "array"
        pass: "boolean"
        reasoning: "string"
        execution_time_ms: "integer"
      spatial:
        validators: "array"
        pass: "boolean"
        diagram_url: "string"
        execution_time_ms: "integer"
      narrative:
        validators: "array"
        pass: "boolean"
        explanation: "string"
        execution_time_ms: "integer"
      kinetic:
        executor: "string"
        pass: "boolean"
        output: "string"
        execution_time_ms: "integer"
        
    consensus:
      verdict: "string"
      votes: "string"
      confidence: "float"
      
    provenance:
      operator: "string"
      session_id: "string"
      git_commit: "string"
      gpg_signature: "string"
      opentimestamp: "string"

# ============================================================================
# IMPLEMENTATION EXAMPLES
# ============================================================================

examples:
  example_1:
    name: "Verify Python Function"
    claim: |
      def is_prime(n):
          if n < 2:
              return False
          for i in range(2, int(n**0.5) + 1):
              if n % i == 0:
                  return False
          return True
          
    verification_result:
      symbolic:
        pass: true
        reasoning: |
          ✅ Correct base case (n < 2)
          ✅ Correct loop range (2 to sqrt(n))
          ✅ Correct divisibility check
          ✅ Correct return values
        validator: "claude"
        
      spatial:
        pass: true
        diagram: |
          n < 2? → False
          n ≥ 2? → Check divisors [2, √n]
                → Found divisor? → False
                → No divisor? → True
        validator: "gpt"
        
      narrative:
        pass: true
        explanation: |
          This function checks if a number is prime. First, it handles
          the base case (numbers less than 2 aren't prime). Then it tests
          divisibility by all numbers from 2 to the square root of n.
          If any divisor is found, it's not prime. Otherwise, it is.
        validator: "claude"
        
      kinetic:
        pass: true
        output: |
          assert is_prime(2) == True
          assert is_prime(3) == True
          assert is_prime(4) == False
          assert is_prime(17) == True
          assert is_prime(20) == False
          All tests passed ✅
        executor: "python_sandbox"
        
      consensus:
        votes: "4/4"
        verdict: "TRUTH ✅"
        confidence: 0.95
        
  example_2:
    name: "Verify System Architecture"
    claim: "Memory mesh connects 3 LLMs to Qdrant and Redis for unified context"
    
    verification_result:
      symbolic:
        pass: true
        reasoning: |
          ✅ Graph structure is valid (3 sources → 1 hub → 2 sinks)
          ✅ No circular dependencies
          ✅ All connections typed correctly
        validator: "claude"
        
      spatial:
        pass: true
        diagram: |
          Claude ─┐
                  ├─→ Memory Mesh ─┬→ Qdrant
          GPT ────┤                └→ Redis
                  │
          Ollama ─┘
        validator: "gpt"
        
      narrative:
        pass: true
        explanation: |
          The memory mesh acts as a central hub. Three LLMs (Claude, GPT, Ollama)
          connect to it to share context. The mesh stores data in Qdrant for
          vector search and Redis for fast caching. This creates a unified
          consciousness layer where any LLM can access context from any other.
        validator: "claude"
        
      kinetic:
        pass: true
        output: |
          $ docker compose up -d
          ✅ qdrant started
          ✅ redis started
          ✅ memory-mesh started (connected to both)
          ✅ claude-api connected to memory-mesh
          ✅ gpt-api connected to memory-mesh
          ✅ ollama connected to memory-mesh
          
          Health checks passed:
          ✅ http://localhost:8001/health → 200 OK
          ✅ http://localhost:8002/health → 200 OK
          ✅ http://localhost:11434/api/tags → 200 OK
          ✅ http://localhost:7000/health → 200 OK
        executor: "docker"
        
      consensus:
        votes: "4/4"
        verdict: "TRUTH ✅"
        confidence: 0.98

# ============================================================================
# PERFORMANCE METRICS
# ============================================================================

performance:
  expected_latency:
    symbolic_check: "5-10 seconds"
    spatial_check: "10-20 seconds"
    narrative_check: "5-15 seconds"
    kinetic_check: "10-60 seconds"
    total_verification: "30-90 seconds"
    
  parallelization:
    symbolic_spatial_narrative: "parallel"
    kinetic: "sequential"
    speedup: "3x"
    
  caching:
    enabled: true
    cache_verified_claims: true
    ttl_seconds: 86400  # 24 hours

# ============================================================================
# INTEGRATION
# ============================================================================

integration:
  memory_mesh:
    enabled: true
    store_verification_results: true
    include_in_context: true
    
  llm_routing:
    route_by_dimension:
      symbolic: ["claude", "gpt"]
      spatial: ["claude", "gpt"]
      narrative: ["claude", "gpt", "ollama"]
      kinetic: ["code_sandbox"]
      
  export:
    include_in_sovereign_export: true
    format: "verification_audit_trail"

