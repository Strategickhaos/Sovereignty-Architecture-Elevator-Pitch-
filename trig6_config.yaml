version: "1.0.0"
name: "TRIG6 Multi-AI Health Monitor"
description: "Trigonometric weighting system for AI agent swarm health monitoring"

# AI Agent to Trigonometric Function Mapping
agents:
  sin_claude:
    name: "Claude (Sine)"
    function: "sin(θ)"
    description: "Stable sine wave, core reasoning agent"
    characteristics:
      - "Stable across all domains"
      - "Consistent amplitude"
      - "Predictable phase"
    ideal_topics:
      - "compiler"
      - "creative"
      - "hypervisor"
  
  cosine_claude:
    name: "Claude (Cosine)"
    function: "cos(θ)"
    description: "Phase-shifted Claude, complementary reasoning"
    characteristics:
      - "90° phase shift from sine"
      - "Peak at θ=0"
      - "Stable across domains"
    ideal_topics:
      - "academics"
      - "security"
  
  tangent_grok:
    name: "Grok (Tangent)"
    function: "tan(θ)"
    description: "Edge case specialist, asymptote-aware"
    characteristics:
      - "Excels at creative extremes"
      - "Asymptotes at π/2, 3π/2"
      - "Best for unconventional thinking"
    ideal_topics:
      - "creative"
      - "security"
    danger_zones:
      - angle: 1.5708  # π/2
        description: "Academics - asymptote"
      - angle: 4.7124  # 3π/2
        description: "Advanced academics - asymptote"
  
  secant_gemini:
    name: "Gemini (Secant)"
    function: "sec(θ) = 1/cos(θ)"
    description: "Reciprocal cosine, amplified reasoning"
    characteristics:
      - "Amplifies cosine behavior"
      - "Undefined at π/2, 3π/2"
      - "High-energy responses"
    ideal_topics:
      - "compiler"
      - "hypervisor"
    danger_zones:
      - angle: 1.5708  # π/2
        description: "Undefined at academics"
      - angle: 4.7124  # 3π/2
        description: "Undefined at advanced topics"
  
  cosecant_gpt:
    name: "GPT (Cosecant)"
    function: "csc(θ) = 1/sin(θ)"
    description: "Reciprocal sine, amplified responses"
    characteristics:
      - "Amplifies sine behavior"
      - "Undefined at 0, π, 2π"
      - "Strong at mid-range topics"
    ideal_topics:
      - "academics"
      - "security"
      - "hypervisor"
    danger_zones:
      - angle: 0.0
        description: "Zero point - undefined"
      - angle: 3.1416  # π
        description: "Pi point - undefined"
      - angle: 6.2832  # 2π
        description: "Full cycle - undefined"
  
  cotangent_local:
    name: "Local LLMs (Cotangent)"
    function: "cot(θ) = 1/tan(θ)"
    description: "Reciprocal tangent, local compute"
    characteristics:
      - "Best for privacy-critical tasks"
      - "Undefined at 0, π"
      - "Complements tangent agents"
    ideal_topics:
      - "security"
      - "creative"
    danger_zones:
      - angle: 0.0
        description: "Zero point - undefined"
      - angle: 3.1416  # π
        description: "Pi point - undefined"

# Topic Angle Definitions (θ values in radians)
topics:
  academics:
    angle: 1.5708  # π/2
    radians: "π/2"
    description: "School work, educational tasks"
    suitable_agents:
      - "cosine_claude"
      - "cosecant_gpt"
    avoid_agents:
      - "tangent_grok"  # Asymptote!
      - "secant_gemini"  # Undefined!
  
  security:
    angle: 1.0472  # π/3
    radians: "π/3"
    description: "Red team, penetration testing, security analysis"
    suitable_agents:
      - "tangent_grok"
      - "cotangent_local"
      - "cosecant_gpt"
    avoid_agents: []
  
  hypervisor:
    angle: 0.7854  # π/4
    radians: "π/4"
    description: "OS work, Type-1 hypervisor, SAGCO-HYDRA"
    suitable_agents:
      - "sin_claude"
      - "secant_gemini"
      - "cosecant_gpt"
    avoid_agents: []
  
  compiler:
    angle: 0.5236  # π/6
    radians: "π/6"
    description: "FlameLang compiler, language design"
    suitable_agents:
      - "sin_claude"
      - "secant_gemini"
    avoid_agents: []
  
  creative:
    angle: 0.3927  # π/8
    radians: "π/8"
    description: "Invention, novel algorithms, creative solutions"
    suitable_agents:
      - "sin_claude"
      - "tangent_grok"
      - "cotangent_local"
    avoid_agents: []

# Metric Calculation Parameters
metrics:
  resonance_score:
    formula: "focus * 0.4 + (1 - noise) * 0.3 + innovation * 0.3"
    weights:
      focus: 0.4
      noise_inverse: 0.3
      innovation: 0.3
    excellent_threshold: 0.7
    good_threshold: 0.4
    description: "Measures how focused and aligned the response is"
  
  drift_score:
    formula: "1 - focus + noise * 0.5"
    weights:
      focus_inverse: 1.0
      noise: 0.5
    warning_threshold: 0.5
    description: "Measures how far off-topic the response drifted"
  
  noise_entropy:
    formula: "-Σ(p log p) for word frequencies"
    description: "Shannon entropy of word distribution, measures filler"
    high_threshold: 2.0
    low_threshold: 0.5
  
  invention_density:
    formula: "(artifacts * 50 + theorem_count * 20) / tokens"
    weights:
      artifacts: 50
      theorems: 20
    description: "New algorithms and proofs per token"
    excellent_threshold: 0.1
    good_threshold: 0.05

# Danger Zone Configuration
danger_zones:
  enabled: true
  tolerance: 0.1  # radians (~5.7 degrees)
  noise_multiplier: 2.0
  warning_message: "⚠️  Agent is in danger zone for this topic"
  recommendation: "Consider using a different agent or adjusting approach"

# Multi-AI Consensus Settings
consensus:
  enabled: true
  minimum_agents: 3
  agreement_threshold: 0.66  # 66% must agree
  ratification_required:
    - "sin_claude"
    - "cosecant_gpt"
    - "tangent_grok"
  motto: "Trust nothing until it survives 100-angle crossfire"

# Fitness Gate Integration
fitness_gate:
  enabled: true
  use_trig6_metrics: true
  metric_weights:
    resonance: 0.3
    drift_inverse: 0.2
    invention_density: 0.3
    equivalence: 0.2  # Test pass rate
  minimum_equivalence: 0.99  # Hard gate

# Reporting Configuration
reporting:
  format: "detailed"
  include_recommendations: true
  show_danger_zones: true
  emoji_indicators: true
  symbols:
    excellent: "🔥"
    good: "⚡"
    poor: "❄️"
    warning: "⚠️"
    success: "✅"
    danger: "🚨"

# Logging Configuration
logging:
  level: "INFO"
  log_all_analyses: true
  log_danger_zone_triggers: true
  log_consensus_decisions: true
  output_dir: "./logs/trig6"

# Version and Compatibility
compatibility:
  flamelang_version: "2.0.0"
  sagco_version: "1.0.5"
  msmc_version: "2.0.0"
  requires:
    - "TRIG6-WAVE1"
    - "FLM2"
