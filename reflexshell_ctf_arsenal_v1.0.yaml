# ============================================================
# ENVIRONMENT-SPECIFIC WORKFLOWS
# ============================================================
workflows:
  k8s_cluster_compromise:
    description: "Progression through your 4-node cluster"
    nodes: ["athena", "nova", "lyra", "ipower"]
