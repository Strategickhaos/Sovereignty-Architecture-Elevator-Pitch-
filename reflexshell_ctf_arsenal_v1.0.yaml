# ============================================================
# DETECTION CHECKS (Run First)
# ============================================================
detection_checks:
  container_context:
    check: "cat /proc/1/cgroup | grep -q docker && echo 'CONTAINER'"
    privileged: "ip link add dummy0 type dummy 2>/dev/null && echo 'PRIVILEGED'"
    description: "Determine if running in container and privilege level"
    
  k8s_context:
    check: "ls /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null"
    description: "Verify Kubernetes pod context"
    
  wsl_context:
    from_wsl: "grep -q WSL /proc/version && echo 'WSL'"
    from_windows: "wsl.exe --list --verbose"
    description: "Detect WSL environment from both sides"
    
  tailscale_context:
    check: "tailscale status >/dev/null 2>&1 && echo 'TAILSCALE'"
    description: "Verify tailscale daemon availability"

# ============================================================
# MEMORIZATION STRATEGY
# ============================================================
memorization:
  strategy: "The 6×6 grid structure leverages spatial memory—each domain occupies a row (A-F), and command variations flow left-to-right from enumeration to exploitation"
  
  practice_method: "Practice by covering the bottom of each cell and recalling the full syntax from the mnemonic header"
  
  distribution_insight: "The phase distribution shows 18 commands are recon (50%)—this reflects CTF reality where enumeration determines success. The 12 exploit commands form your attack toolkit, while persist and exfil commands (8 total) enable competition endurance and flag extraction."
  
  spatial_organization:
    rows:
      - letter: A
        domain: "Browser Exploitation"
        mnemonic: "Service Workers intercept everything"
      - letter: B
        domain: "Storage Forensics"
        mnemonic: "IDB holds the secrets, export JSON"
      - letter: C
        domain: "Windows Forensics"
        mnemonic: "CimInstance → DLLs → NetTCP → History → Logs → Sysmon"
      - letter: D
        domain: "WSL Pivot"
        mnemonic: "/mnt/c goes both ways, MinGW bridges, SOCKS tunnels"
      - letter: E
        domain: "Network Recon"
        mnemonic: "ping6 multicast → nmap -6 → alive6 → tshark → tailscale"
      - letter: F
        domain: "K8s/Container"
        mnemonic: "Socket → cgroups → disk → token → secrets → nodeName"
