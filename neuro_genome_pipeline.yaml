    frontier: "DNA computing + neuromorphic integration"
    references:
      - "Synthetic neuromorphic cells (Nature Communications)"
      - "Molecular SNNs for computation (arXiv)"

# ═══════════════════════════════════════════════════════════════════════════
# EXECUTION CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════
execution:
  mode: "sequential"  # or "parallel" for independent stages
  
  logging:
    level: "INFO"
    output: "logs/neuro_genome_pipeline.log"
    
  checkpointing:
    enabled: true
    frequency: "per_stage"
    directory: "checkpoints/"
    
  monitoring:
    metrics: ["latency", "throughput", "accuracy", "power"]
    dashboard: "grafana"
    
  error_handling:
    strategy: "fail_fast"
    retry_attempts: 3
    fallback: "log_and_continue"

