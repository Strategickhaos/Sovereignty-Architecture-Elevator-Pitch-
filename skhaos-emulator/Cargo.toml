[package]
name = "skhaos-emulator"
version = "0.1.0"
edition = "2021"
authors = ["Strategickhaos <architect@strategickhaos.com>"]
description = "Bio-Physics Entanglement Compiler (BPEC) - INVENTION_074"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lib]
name = "skhaos_emulator"
path = "src/lib.rs"

[[bin]]
name = "bpec"
path = "src/main.rs"
