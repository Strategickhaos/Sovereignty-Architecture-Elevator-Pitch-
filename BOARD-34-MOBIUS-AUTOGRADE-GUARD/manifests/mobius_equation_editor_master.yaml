master_command: SAGCO_MOBIUS_EQUATION_EDITOR_ERU
version: "1.0"
purpose: "Compare Mobius, Excel, and SAGCO-OS answers using Expected / Actual / Variance / Understanding."

systems:
  mobius:
    role: independent_grader
    accepts: [exact_math_input, interval_notation, Pi, infinity, U_for_union]

  excel:
    role: wafer_grid_checker
    strengths: [tabular_answers, numeric_verification, csv_exports]
    limits: [weak_symbolic_calculus, no_native_high_order_CAS]

  sagco_os:
    role: compiler_and_eru_engine
    pipeline: [lexer, parser, AST, symbolic_math, mobius_guard, ERU_report, missing_link_seed]

eru_schema:
  - question_id
  - problem_text
  - expected
  - actual
  - variance
  - understanding
  - mobius_ready
  - answer_raw
  - answer_formatted
  - independent_check
  - status

questions:
  Q5:
    topic: increasing_decreasing_intervals
    expected: "identify intervals from graph"
    actual:
      increasing: "(-infinity,-5) U (5,infinity)"
      decreasing: "(-5,5)"
    variance: 0
    understanding: "Local max near x=-5; local min near x=5."
    mobius_ready: true
    status: ACCEPTED

  Q6:
    topic: critical_points
    function: "10*x^(2/3) + x^(5/3)"
    expected: "derivative zero or undefined where function exists"
    actual:
      critical_points: [-4, 0]
    variance: 0
    understanding: "Derivative factors as (5/3)*x^(-1/3)*(x+4)."
    mobius_ready: true
    status: ACCEPTED

  Q7:
    topic: local_absolute_extrema
    expected: "classify labeled graph points"
    actual:
      a: local_maximum
      b: local_minimum
      c: absolute_maximum
      d: local_minimum
      e: local_maximum
      f: absolute_minimum
    variance: 0
    understanding: "c is highest point; f is lowest point on closed interval."
    mobius_ready: true
    status: ACCEPTED

  Q8:
    topic: critical_points
    function: "6*x^3 - 5*x"
    expected: "solve f'(x) = 0"
    actual:
      critical_points: ["-sqrt(10)/6", "sqrt(10)/6"]
    variance: 0
    understanding: "f'(x) = 18*x^2 - 5. Set to 0: x^2 = 5/18, x = ±sqrt(10)/6."
    mobius_ready: true
    status: ACCEPTED

  Q9:
    topic: absolute_extrema
    function: "7*x + sin(7*x)"
    interval: "[0, 2*pi]"
    expected: "compare endpoints and critical points"
    actual:
      absolute_maximum: "14*pi"
      absolute_minimum: "0"
    variance: 0
    understanding: "f'(x) = 7*(1 + cos(7*x)) >= 0, so f is increasing on [0,2π]. Max at x=2π, min at x=0."
    mobius_ready: true
    status: ACCEPTED

  Q10:
    topic: critical_points_count
    function: "5*sin(4*x)^2"
    interval: "(0, pi)"
    expected: "count x = n*pi/8 for 0 < n < 8"
    actual:
      number_of_critical_points: 7
      first_critical_point: "Pi/8"
      second_critical_point: "Pi/4"
    variance: 0
    understanding: "f'(x) = 20*sin(8*x). Zeros in (0,π): x = n*π/8, n = 1..7."
    mobius_ready: true
    status: ACCEPTED

master_commands:
  build_report:    "python sagco-agents/sagco.py guard --homework"
  run_omni:        "python sagco-agents/sagco.py omni diff"
  run_mobius_lab:  "python BOARD-31-CELLPHONE-MOBIUS-LAB/src/eru_runner.py"
  export_excel:    "python BOARD-31-CELLPHONE-MOBIUS-LAB/src/ast_to_excel.py"
  verify_all:      "python sagco-agents/sagco.py guard --verify-master"

output_files:
  eru_report:  "BOARD-31-CELLPHONE-MOBIUS-LAB/reports/mobius_eru.yaml"
  excel_wafer: "BOARD-31-CELLPHONE-MOBIUS-LAB/reports/mobius_excel_view.csv"
  proofs:      "BOARD-34-MOBIUS-AUTOGRADE-GUARD/proofs/"

confidence:
  lexer_works:   true
  parser_works:  true
  ast_works:     true
  math_engine:   true
  mobius_accepted: true
  tests_green:   true
  engineer_confidence: "95-99%"
  basis: |
    Not because the compiler ran.
    Because: Expected = Actual, Variance = 0,
    across multiple questions AND an independent grader (Mobius) accepted them.
    That is ERU applied to a compiler.

status: MODULE_4_PROBLEM_SET_VERIFIED
