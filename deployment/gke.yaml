apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmb-detector
  labels:
    app: cmb-anomaly-detector
    version: v1.0
    component: analyzer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cmb-anomaly-detector
  template:
    metadata:
      labels:
        app: cmb-anomaly-detector
        version: v1.0
    spec:
      containers:
      - name: detector
        image: gcr.io/project/cmb-detector:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: LOG_LEVEL
          value: "ERROR"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cmb-detector-service
  labels:
    app: cmb-anomaly-detector
spec:
  type: LoadBalancer
  selector:
    app: cmb-anomaly-detector
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cmb-detector-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cmb-detector
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cmb-detector-config
data:
  config.yaml: |
    anomaly_detection:
      lqg_model:
        enabled: true
        suppression_threshold: -2.0
      string_model:
        enabled: true
        decay_rate: 0.5
    evolution:
      mutation_rate: 0.1
      population_size: 10
    logging:
      level: ERROR
      format: json
