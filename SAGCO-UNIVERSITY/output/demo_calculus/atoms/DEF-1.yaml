atom_id: DEF-1
atom_type: definition
content: 'A critical point occurs where f''(x) = 0 or f''(x) is undefined

  Formula: Bond Order = (Bonding Electrons - Antibonding Electrons) / 2

  Example: For f(x) = x^2 - 4, f''(x) = 2x, critical point at x=0'
