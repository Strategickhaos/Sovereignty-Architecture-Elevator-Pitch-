      - communication: "WiFi/Bluetooth (remote monitoring)"
      - enhanced_adc: "ADS1115 16-bit (higher precision)"

  software:
    trig6_engine:
      state_variables:
        R:
          name: "Resonance"
          type: "float"
          range: "[0, R_max]"
          default: "0.0"
          description: "Self-reinforcement strength"
        
        D:
          name: "Drift"
          type: "float"
          range: "[0, D_crit]"
          default: "0.0"
          description: "Deviation tendency from equilibrium"
        
        N:
          name: "Noise"
          type: "float"
          range: "[0, N_max]"
          default: "0.0"
          description: "Stochastic perturbations"
        
        theta:
          name: "Phase"
          type: "float"
          range: "[0, 2π]"
          cyclic: true
          description: "Angular position in cycle"
        
        f:
          name: "Fitness"
          type: "float"
          range: "[0, 1]"
          description: "Success/stability measure"
      
      evolution_equations:
        phase_mapping:
          formula: "θ = (pot_value / ADC_max) * 2π"
          description: "Convert potentiometer reading to phase angle"
        
        resonance_update:
          formula: "R = R_prev + α·cos(θ) + N"
          parameters:
            alpha: 
              description: "Evolution rate parameter"
              default: 0.1
              range: "[0.01, 1.0]"
        
        drift_accumulation:
          formula: "D = |θ - θ_prev| + decay·D_prev"
          parameters:
            decay:
              description: "Drift decay factor"
              default: 0.95
              range: "[0.8, 0.99]"
        
        noise_calculation:
          formula: "N = sensor_noise + model_noise"
          components:
            sensor_noise: "ADC quantization + electrical jitter"
            model_noise: "Stochastic TRIG6 term"
      
      fitness_evaluation:
        generic_fitness:
          formula: |
            f = exp(-|R - ideal_R|) * 
                exp(-D/max_drift) * 
                (1 + cos(θ - ideal_theta))/2 * 
                exp(-N*noise_penalty)
          parameters:
            ideal_R: 
              default: 1.0
              description: "Target resonance value"
            max_drift:
              default: 0.1
              description: "Maximum acceptable drift"
            ideal_theta:
              default: "π"
              description: "Ideal phase position"
            noise_penalty:
              default: 10.0
              description: "Noise sensitivity factor"
        
        domain_specific:
          fermentation:
            description: "Optimize fermentation stability"
            parameters:
              ideal_temperature: "20.0°C"
              temp_tolerance: "±2°C"
              max_contamination_drift: "0.05"
          
          material_curing:
            description: "Validate curing protocols"
            parameters:
              min_strength: "0.8"
              max_crack_tendency: "0.05"
              curing_window: "[π/2, 3π/2]"
          
          eeg_stability:
            description: "Find non-seizure basins"
            parameters:
              safe_frequency_range: "[8, 30] Hz"
              max_amplitude_drift: "0.1"
              spike_danger_threshold: "2.0"
      
      danger_detection:
        conditions:
          resonance_overflow:
            formula: "R > R_max"
            action: "Set danger flag, halt evolution"
          
          critical_drift:
            formula: "D > D_crit"
            action: "Set danger flag, warn operator"
          
          phase_forbidden_zone:
            formula: "θ in forbidden_ranges"
            action: "Set danger flag, indicate escape path"
        
        parameters:
          R_max:
            default: 2.0
            description: "Maximum safe resonance"
          D_crit:
            default: 0.5
            description: "Critical drift threshold"
          forbidden_ranges:
            default: []
            description: "List of (θ_min, θ_max) danger zones"
      
      evolution_gate:
        validation_logic:
          fitness_threshold:
            default: 0.8
            range: "[0.7, 0.95]"
            description: "Minimum fitness for proven status"
          
          min_stable_duration:
            default: "1.0 seconds"
            description: "Time above threshold before logging"
          
          population_size:
            default: 10
            description: "Number of proven configs to collect"
        
        proof_output:
          format: "YAML"
          fields:
            - "timestamp"
            - "pot_value"
            - "phase_space_state (R, D, θ, N)"
            - "fitness"
            - "basin_name"
            - "domain_metadata"

