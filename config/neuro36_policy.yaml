      reason: "CPU-intensive operations - GPU acceleration"
    - id: 12
      name: "Cache Manager"
      reason: "Memory access patterns - Custom cache controller"

kernel_ligand:
  amino_acids:
    M: "Memory - Manage allocation and deallocation"
    A: "Access - Control permissions and authentication"
    C: "Compute - Execute calculations and processing"
    Q: "Queue - Handle task scheduling and ordering"
    G: "Guard - Protect against threats and intrusions"
    I: "Integrate - Connect components and systems"
    L: "Log - Record events and audit trails"
    P: "Process - Transform and manipulate data"

  instruction_biases:
    memory_intensive: "Favor M, Q operations for data structures"
    security_critical: "Emphasize G, A, L for protection"
    performance_critical: "Optimize C, P, Q for speed"
    integration_focused: "Prioritize I, L for connectivity"

  default_profile: "Balanced MACQGILP profile with emphasis on security (G, A) and performance (C, P)"
