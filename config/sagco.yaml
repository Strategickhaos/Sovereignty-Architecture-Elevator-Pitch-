# SAGCO Configuration File
# Sovereignty Architecture Grand Central Operating System

version: "0.1.0"

# Cognitive Layer Configuration
layers:
  reflexive:
    description: "Instant response layer for immediate actions"
    response_time_ms: 100
    max_concurrent_operations: 10
    enabled: true
  
  tactical:
    description: "Short-term planning (24-hour window)"
    planning_window_hours: 24
    task_batch_size: 5
    optimization_interval_minutes: 15
    enabled: true
  
  strategic:
    description: "Long-term vision (90-day window)"
    planning_window_days: 90
    goal_review_frequency_days: 7
    milestone_tracking: true
    enabled: true
  
  sovereign:
    description: "Meta-awareness and system optimization"
    awareness_depth: "maximum"
    self_reflection_enabled: true
    pattern_recognition: true
    enabled: true

# Dopamine-Driven Motivation System
dopamine:
  baseline_threshold: 50
  flow_threshold: 85
  depletion_threshold: 20
  recovery_rate: 5  # Points per hour of rest
  
  # Task completion rewards
  rewards:
    critical_task: 20
    high_priority: 15
    medium_priority: 10
    low_priority: 5
  
  # Depletion triggers
  depletion_triggers:
    consecutive_failures: 3
    hours_without_break: 4
    tasks_pending_critical: 10

# Academic Excellence Tracking
academic:
  # GPA Management
  target_gpa: 4.0
  min_acceptable_gpa: 3.5
  gpa_warning_threshold: 3.7
  
  # Study Time Management
  min_study_hours_per_day: 4
  max_study_hours_per_day: 8
  optimal_study_session_minutes: 50
  break_duration_minutes: 10
  
  # Task Management
  max_concurrent_tasks: 5
  task_buffer_hours: 24  # Finish tasks 24h before deadline
  
  # Performance Tracking
  track_quiz_scores: true
  track_discussion_posts: true
  track_assignment_submissions: true
  track_study_hours: true
  
  # Courses
  courses:
    - code: "CYBER-PSY-620"
      name: "Cyberpsychology"
      credits: 3
      priority: "critical"
      discussion_deadline: "Sunday 23:59 EST"
    
    - code: "IT-510"
      name: "Advanced Software Engineering"
      credits: 3
      priority: "high"

# Performance Optimization
optimization:
  enabled: true
  interval_seconds: 60
  
  # Optimization strategies
  strategies:
    - name: "priority_rebalancing"
      enabled: true
      frequency: "hourly"
    
    - name: "dopamine_optimization"
      enabled: true
      frequency: "continuous"
    
    - name: "task_consolidation"
      enabled: true
      frequency: "daily"
    
    - name: "deadline_forecasting"
      enabled: true
      frequency: "hourly"

# Resource Management
resources:
  max_memory_mb: 512
  max_cpu_percent: 80
  disk_space_warning_gb: 10
  
  # Database
  database:
    type: "postgresql"
    host: "${POSTGRES_HOST:-localhost}"
    port: "${POSTGRES_PORT:-5432}"
    name: "sagco"
    pool_size: 10
    pool_max_overflow: 20
  
  # Cache
  cache:
    type: "redis"
    host: "${REDIS_HOST:-localhost}"
    port: "${REDIS_PORT:-6379}"
    ttl_seconds: 3600
  
  # Vector Database (for AI features)
  vector_db:
    type: "qdrant"
    host: "${QDRANT_HOST:-localhost}"
    port: "${QDRANT_PORT:-6333}"
    collection: "sagco_knowledge"

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_enabled: true
  cors_origins:
    - "http://localhost:3000"
    - "https://sagco.strategickhaos.com"
  
  # Authentication
  auth:
    enabled: true
    jwt_secret: "${JWT_SECRET}"
    jwt_algorithm: "HS256"
    access_token_expire_minutes: 30
  
  # Rate Limiting
  rate_limit:
    enabled: true
    requests_per_minute: 60

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Log destinations
  destinations:
    - type: "console"
      enabled: true
    
    - type: "file"
      enabled: true
      path: "/var/log/sagco/sagco.log"
      max_bytes: 10485760  # 10MB
      backup_count: 5
    
    - type: "cloudwatch"
      enabled: false
      log_group: "/sagco/production"
      stream_name: "kernel"

# Monitoring and Alerting
monitoring:
  enabled: true
  
  # Metrics
  metrics:
    prometheus_enabled: true
    prometheus_port: 9090
    
    # Key metrics to track
    track:
      - "task_completion_rate"
      - "dopamine_level"
      - "academic_gpa"
      - "system_uptime"
      - "optimization_cycles"
  
  # Health checks
  health_checks:
    enabled: true
    interval_seconds: 30
    timeout_seconds: 5
  
  # Alerts
  alerts:
    - name: "gpa_warning"
      condition: "current_gpa < 3.7"
      severity: "warning"
      channel: "email"
    
    - name: "dopamine_depleted"
      condition: "dopamine_level == 'depleted'"
      severity: "info"
      channel: "slack"
    
    - name: "critical_deadline"
      condition: "task.deadline < 12h AND task.priority == 'critical'"
      severity: "critical"
      channel: "sms"

# Integration Configuration
integrations:
  # GitHub
  github:
    enabled: false
    token: "${GITHUB_TOKEN}"
    repos:
      - "Strategickhaos/Sovereignty-Architecture-Elevator-Pitch-"
  
  # Discord
  discord:
    enabled: false
    bot_token: "${DISCORD_BOT_TOKEN}"
    channels:
      alerts: "${DISCORD_ALERTS_CHANNEL}"
      status: "${DISCORD_STATUS_CHANNEL}"
  
  # Calendar (Google Calendar, etc.)
  calendar:
    enabled: false
    provider: "google"
    calendar_id: "${GOOGLE_CALENDAR_ID}"

# Feature Flags
features:
  ai_assistance: true
  automated_scheduling: true
  performance_predictions: true
  collaborative_mode: false
  experimental_features: false
