apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vllm-infer
  namespace: dom-llm
  labels:
    app: vllm
    component: inference
spec:
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
        component: inference
    spec:
      # Only deploy on GPU nodes
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-t4
      
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        args:
        - "--model"
        - "meta-llama/Llama-3.2-405B-Instruct"
        - "--tensor-parallel-size"
        - "2"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8000"
        - "--trust-remote-code"
        - "--max-model-len"
        - "4096"
        
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        
        resources:
          limits:
            nvidia.com/gpu: 2
            memory: 48Gi
            cpu: 12
          requests:
            nvidia.com/gpu: 2
            memory: 32Gi
            cpu: 8
        
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1"
        - name: VLLM_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: vllm-secrets
              key: hf-token
              optional: true
        
        volumeMounts:
        - name: cache
          mountPath: /root/.cache
        - name: shm
          mountPath: /dev/shm
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
      
      volumes:
      - name: cache
        emptyDir:
          sizeLimit: 100Gi
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-infer
  namespace: dom-llm
  labels:
    app: vllm
spec:
  selector:
    app: vllm
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
  sessionAffinity: ClientIP
---
apiVersion: v1
kind: Secret
metadata:
  name: vllm-secrets
  namespace: dom-llm
type: Opaque
stringData:
  hf-token: "REPLACE_WITH_YOUR_HUGGINGFACE_TOKEN"
