name: Deploy to GKE

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  IMAGE_NAME: ctf-brain

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Run tests
      run: |
        pip install -r requirements.txt
        pytest tests/ -v
    
    - name: Setup Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
    
    - name: Configure Docker for GCR
      run: |
        gcloud --quiet auth configure-docker
    
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials "$GKE_CLUSTER" --zone "$GKE_ZONE"
    
    - name: Build Docker image
      run: |
        docker build -t "gcr.io/$PROJECT_ID/$IMAGE_NAME:${GITHUB_SHA::8}" \
                     -t "gcr.io/$PROJECT_ID/$IMAGE_NAME:latest" .
    
    - name: Publish Docker image to GCR
      run: |
        docker push "gcr.io/$PROJECT_ID/$IMAGE_NAME:${GITHUB_SHA::8}"
        docker push "gcr.io/$PROJECT_ID/$IMAGE_NAME:latest"
    
    - name: Deploy to GKE
      run: |
        # Update image in deployment
        kubectl set image deployment/ctf-brain \
          ctf-brain=gcr.io/$PROJECT_ID/$IMAGE_NAME:${GITHUB_SHA::8} \
          -n ctf-tools
        
        kubectl set image deployment/netcat-proxy \
          netcat-proxy=gcr.io/$PROJECT_ID/$IMAGE_NAME:${GITHUB_SHA::8} \
          -n ctf-tools
        
        # Wait for rollout
        kubectl rollout status deployment/ctf-brain -n ctf-tools
        kubectl rollout status deployment/netcat-proxy -n ctf-tools
    
    - name: Verify deployment
      run: |
        kubectl get pods -n ctf-tools
        kubectl get services -n ctf-tools
    
    - name: Notify deployment
      if: success()
      run: |
        echo "✅ Deployment successful to GKE"
        echo "Cluster: $GKE_CLUSTER"
        echo "Zone: $GKE_ZONE"
        echo "Image: gcr.io/$PROJECT_ID/$IMAGE_NAME:${GITHUB_SHA::8}"
