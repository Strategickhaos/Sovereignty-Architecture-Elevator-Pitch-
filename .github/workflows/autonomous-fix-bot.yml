name: Autonomous Fix Bot

on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [slack-fix-request]

jobs:
  process-fix-request:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/apply-fix')) ||
      github.event_name == 'repository_dispatch'
    
    steps:
      - name: 🔍 Parse Fix Request
        id: parse
        run: |
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            # Extract fix from comment
            COMMENT="${{ github.event.comment.body }}"
            echo "source=issue_comment" >> $GITHUB_OUTPUT
            echo "requester=${{ github.event.comment.user.login }}" >> $GITHUB_OUTPUT
          else
            # Extract from repository dispatch
            echo "source=slack" >> $GITHUB_OUTPUT
            echo "requester=${{ github.event.client_payload.user }}" >> $GITHUB_OUTPUT
          fi
          
          # Generate unique branch name
          TIMESTAMP=$(date +%s)
          BRANCH_NAME="auto-fix-${TIMESTAMP}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 📥 Install dependencies
        run: npm ci
        
      - name: ✅ Validate fix
        id: validate
        run: |
          # This is where you would add custom validation logic
          # For now, we'll just check if TypeScript compiles
          npm run build
          
          if [ $? -eq 0 ]; then
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "✅ Fix validated successfully"
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "❌ Fix validation failed"
            exit 1
          fi
          
      - name: 🔐 Security scan
        if: steps.validate.outputs.valid == 'true'
        id: security
        run: |
          # Run security checks
          echo "🔍 Running security scans..."
          
          # Check for secrets in code
          if command -v git-secrets &> /dev/null; then
            git secrets --scan
          fi
          
          # Check for vulnerabilities in dependencies
          AUDIT_OUTPUT=$(npm audit --audit-level=moderate 2>&1 || echo "AUDIT_FAILED")
          
          if [[ "$AUDIT_OUTPUT" == *"AUDIT_FAILED"* ]]; then
            echo "⚠️ Security vulnerabilities detected"
            echo "audit_status=warning" >> $GITHUB_OUTPUT
            echo "$AUDIT_OUTPUT" > audit_results.txt
          else
            echo "✅ No security vulnerabilities detected"
            echo "audit_status=passed" >> $GITHUB_OUTPUT
          fi
          
      - name: 🌿 Create branch and commit
        if: steps.validate.outputs.valid == 'true'
        run: |
          git config user.name "Autonomous Fix Bot"
          git config user.email "bot@strategickhaos.com"
          git add .
          
      - name: 📝 Create Pull Request
        if: steps.validate.outputs.valid == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.parse.outputs.branch_name }}
          base: main
          commit-message: |
            Auto-fix: Applied fix from ${{ steps.parse.outputs.source }}
            
            Requested by: ${{ steps.parse.outputs.requester }}
            Source: ${{ steps.parse.outputs.source }}
          title: "🤖 Auto-fix from ${{ steps.parse.outputs.source }}"
          body: |
            ## Automated Fix Applied
            
            **Source:** ${{ steps.parse.outputs.source }}
            **Requested by:** ${{ steps.parse.outputs.requester }}
            **Timestamp:** ${{ steps.parse.outputs.branch_name }}
            
            ### Validation Results
            - ✅ TypeScript build passed
            - ${{ steps.security.outputs.audit_status == 'passed' && '✅' || '⚠️' }} Security scan ${{ steps.security.outputs.audit_status }}
            
            ${{ steps.security.outputs.audit_status == 'warning' && '**⚠️ Security Warning:** Vulnerabilities detected. Please review audit results before merging.' || '' }}
            
            ### Manual Review Required
            Please review the changes carefully before merging.
            
            ### Actions Available
            - ✅ Approve and merge if changes look good
            - ❌ Close if changes are incorrect
            - 💬 Comment for questions or modifications
            
            ---
            *This PR was automatically generated by the Autonomous Fix Bot*
          labels: |
            automated
            needs-review
          reviewers: ${{ github.repository_owner }}
          
      - name: 📱 Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ -n "$DISCORD_WEBHOOK_URL" ]]; then
            STATUS="${{ steps.validate.outputs.valid == 'true' && '✅ Success' || '❌ Failed' }}"
            COLOR="${{ steps.validate.outputs.valid == 'true' && '3066993' || '15158332' }}"
            
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "embeds": [{
                  "title": "🤖 Autonomous Fix Applied",
                  "description": "'"$STATUS"': Fix from '"${{ steps.parse.outputs.source }}"'",
                  "color": '"$COLOR"',
                  "fields": [
                    {
                      "name": "Requester",
                      "value": "'"${{ steps.parse.outputs.requester }}"'",
                      "inline": true
                    },
                    {
                      "name": "Branch",
                      "value": "'"${{ steps.parse.outputs.branch_name }}"'",
                      "inline": true
                    },
                    {
                      "name": "Repository",
                      "value": "'"${{ github.repository }}"'"
                    }
                  ],
                  "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
                }]
              }'
          fi
          
  auto-merge:
    needs: process-fix-request
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' && 
      contains(github.event.comment.body, '/auto-merge') &&
      github.event.comment.user.login == github.repository_owner
    
    steps:
      - name: 🔍 Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.issue;
            return issue.number;
            
      - name: ✅ Enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.result }};
            
            // Enable auto-merge for the PR
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'squash'
            });
            
            console.log(`✅ Auto-merge enabled for PR #${prNumber}`);
            
      - name: 📱 Notify success
        run: |
          echo "✅ Auto-merge enabled successfully"
