name: CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run build
      - name: Notify Discord
        if: success() && secrets.DISCORD_TOKEN != '' && secrets.DEPLOYMENTS_CHANNEL_ID != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          bash scripts/gl2discord.sh "Build passed" "${{ github.repository }} @ ${{ github.sha }}"