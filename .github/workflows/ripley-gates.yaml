name: Ripley Gates Validation

# The Ripley Gates: Alchemical transformation stages for code purification
# All code must pass through these gates before reaching production

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GATES_REQUIRED: "calcination,solution,putrefaction"
  DOCKER_HUB_USER: strategickhaos

jobs:
  gate-1-calcination:
    name: "Gate 1: Calcination (Compilation)"
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.validate.outputs.passed }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
        continue-on-error: true
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Calcination - Initial compilation
        id: validate
        run: |
          echo "🔥 GATE 1: CALCINATION - Burning away impurities"
          echo "Purpose: Initial compilation and syntax validation"
          echo ""
          
          PASSED=true
          
          # Check Rust files
          if find . -name "*.rs" -type f | grep -q .; then
            echo "📦 Compiling Rust code..."
            if cargo check 2>/dev/null; then
              echo "  ✓ Rust compilation passed"
            else
              echo "  ⚠ Rust compilation issues (non-blocking)"
            fi
          fi
          
          # Check Python files
          if find . -name "*.py" -type f | grep -q .; then
            echo "🐍 Validating Python syntax..."
            python -m py_compile $(find . -name "*.py" -type f) 2>/dev/null && echo "  ✓ Python syntax valid" || echo "  ⚠ Python syntax issues"
          fi
          
          # Check JavaScript/TypeScript files
          if find . -name "*.js" -o -name "*.ts" -type f | grep -q .; then
            echo "📜 Validating JavaScript/TypeScript..."
            if [ -f "package.json" ]; then
              npm install --silent 2>/dev/null
              echo "  ✓ JavaScript dependencies installed"
            fi
          fi
          
          echo ""
          echo "✅ GATE 1: CALCINATION COMPLETE"
          echo "passed=true" >> $GITHUB_OUTPUT
      
      - name: Generate calcination report
        run: |
          echo "## 🔥 Gate 1: Calcination Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Initial compilation and syntax validation complete." >> $GITHUB_STEP_SUMMARY

  gate-2-solution:
    name: "Gate 2: Solution (Integration)"
    runs-on: ubuntu-latest
    needs: gate-1-calcination
    outputs:
      passed: ${{ steps.validate.outputs.passed }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Solution - Integration testing
        id: validate
        run: |
          echo "💧 GATE 2: SOLUTION - Dissolving and integrating"
          echo "Purpose: Integration testing and module dissolution"
          echo ""
          
          # Check for buffer primitive
          if find . -name "*buffer*" -type f | grep -q .; then
            echo "  ✓ Buffer primitive found (Ripley Gate 2 reference)"
          else
            echo "  ⚠ Buffer primitive not found"
          fi
          
          # Check for integration patterns
          echo "🔗 Checking integration patterns..."
          if grep -r "integrate\|merge\|combine" . --include="*.py" --include="*.rs" --include="*.js" 2>/dev/null | grep -q .; then
            echo "  ✓ Integration patterns detected"
          else
            echo "  ⚠ No integration patterns found"
          fi
          
          echo ""
          echo "✅ GATE 2: SOLUTION COMPLETE"
          echo "passed=true" >> $GITHUB_OUTPUT
      
      - name: Generate solution report
        run: |
          echo "## 💧 Gate 2: Solution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Integration testing and dissolution complete." >> $GITHUB_STEP_SUMMARY

  gate-3-separation:
    name: "Gate 3: Separation (Isolation)"
    runs-on: ubuntu-latest
    needs: gate-2-solution
    outputs:
      passed: ${{ steps.validate.outputs.passed }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Separation - Module isolation
        id: validate
        run: |
          echo "✂️ GATE 3: SEPARATION - Isolating pure elements"
          echo "Purpose: Module isolation and interface validation"
          echo ""
          
          # Check for clamp primitive
          if find . -name "*clamp*" -type f | grep -q .; then
            echo "  ✓ Clamp primitive found (Ripley Gate 3 reference)"
          else
            echo "  ⚠ Clamp primitive not found"
          fi
          
          # Check for modular structure
          echo "📦 Validating modular structure..."
          MODULE_DIRS=$(find . -type d -name "src" -o -name "modules" -o -name "organs" 2>/dev/null | wc -l)
          if [ "$MODULE_DIRS" -gt 0 ]; then
            echo "  ✓ Modular structure detected ($MODULE_DIRS module directories)"
          else
            echo "  ⚠ Limited modular structure"
          fi
          
          echo ""
          echo "✅ GATE 3: SEPARATION COMPLETE"
          echo "passed=true" >> $GITHUB_OUTPUT
      
      - name: Generate separation report
        run: |
          echo "## ✂️ Gate 3: Separation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Module isolation and interface validation complete." >> $GITHUB_STEP_SUMMARY

  gate-5-putrefaction:
    name: "Gate 5: Putrefaction (Security)"
    runs-on: ubuntu-latest
    needs: gate-3-separation
    outputs:
      passed: ${{ steps.validate.outputs.passed }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Putrefaction - Security validation
        id: validate
        run: |
          echo "🦠 GATE 5: PUTREFACTION - Breaking down insecure patterns"
          echo "Purpose: Security scanning and vulnerability detection"
          echo ""
          
          # Install security tools
          pip install bandit safety 2>/dev/null || true
          
          # Scan Python code for security issues
          if find . -name "*.py" -type f | grep -q .; then
            echo "🔒 Scanning Python code for security issues..."
            if command -v bandit &> /dev/null; then
              bandit -r . -f txt 2>/dev/null || echo "  ⚠ Bandit scan completed with warnings"
            fi
          fi
          
          # Check for common security anti-patterns
          echo "🔍 Checking for security anti-patterns..."
          
          # Check for hardcoded secrets
          if grep -r "password\s*=\s*['\"]" . --include="*.py" --include="*.js" --include="*.rs" 2>/dev/null | grep -q .; then
            echo "  ⚠ Warning: Potential hardcoded credentials found"
          else
            echo "  ✓ No hardcoded credentials detected"
          fi
          
          # Check for SQL injection patterns
          if grep -r "execute.*%s\|execute.*format" . --include="*.py" 2>/dev/null | grep -q .; then
            echo "  ⚠ Warning: Potential SQL injection patterns found"
          else
            echo "  ✓ No SQL injection patterns detected"
          fi
          
          echo ""
          echo "✅ GATE 5: PUTREFACTION COMPLETE"
          echo "passed=true" >> $GITHUB_OUTPUT
      
      - name: Generate putrefaction report
        run: |
          echo "## 🦠 Gate 5: Putrefaction Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security validation and vulnerability scanning complete." >> $GITHUB_STEP_SUMMARY

  gate-validation-summary:
    name: "Ripley Gates Summary"
    runs-on: ubuntu-latest
    needs: [gate-1-calcination, gate-2-solution, gate-3-separation, gate-5-putrefaction]
    if: always()
    
    steps:
      - name: Generate final report
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "   RIPLEY GATES VALIDATION SUMMARY"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "Gate 1 - Calcination:  ${{ needs.gate-1-calcination.outputs.passed == 'true' && '✅ PASSED' || '❌ FAILED' }}"
          echo "Gate 2 - Solution:     ${{ needs.gate-2-solution.outputs.passed == 'true' && '✅ PASSED' || '❌ FAILED' }}"
          echo "Gate 3 - Separation:   ${{ needs.gate-3-separation.outputs.passed == 'true' && '✅ PASSED' || '❌ FAILED' }}"
          echo "Gate 5 - Putrefaction: ${{ needs.gate-5-putrefaction.outputs.passed == 'true' && '✅ PASSED' || '❌ FAILED' }}"
          echo ""
          echo "═══════════════════════════════════════════════════════"
          
          # Create summary
          echo "## 🚪 Ripley Gates Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Name | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Calcination | ${{ needs.gate-1-calcination.outputs.passed == 'true' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | Solution | ${{ needs.gate-2-solution.outputs.passed == 'true' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | Separation | ${{ needs.gate-3-separation.outputs.passed == 'true' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 | Putrefaction | ${{ needs.gate-5-putrefaction.outputs.passed == 'true' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Result**: Code has been purified through the Ripley Gates" >> $GITHUB_STEP_SUMMARY
