[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagco-os"
version = "0.1.0"
description = "SAGCO OS - Sovereignty Architecture Governance Cognitive Operating System"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "StrategicKhaos DAO LLC", email = "contact@strategickhaos.com"}
]
keywords = ["cognitive", "ai", "architecture", "sovereignty", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
sagco = "src.core.sagco:main"

[project.urls]
Homepage = "https://github.com/Strategickhaos/Sovereignty-Architecture-Elevator-Pitch-"
Repository = "https://github.com/Strategickhaos/Sovereignty-Architecture-Elevator-Pitch-"
Issues = "https://github.com/Strategickhaos/Sovereignty-Architecture-Elevator-Pitch-/issues"

[tool.setuptools]
packages = ["src", "src.core", "src.layers", "src.engines", "src.integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
