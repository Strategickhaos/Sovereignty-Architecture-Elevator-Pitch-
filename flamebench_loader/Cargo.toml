[package]
name = "flamebench_loader"
version = "1.0.0"
edition = "2021"
authors = ["Strategickhaos <dom@strategickhaos.io>"]
description = "Load FlameBench results into Uncertainty structures"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "flamebench_loader"
path = "src/lib.rs"

[[bin]]
name = "flamebench_loader"
path = "src/main.rs"
