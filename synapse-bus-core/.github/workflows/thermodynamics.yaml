# [Q4] Entropy Monitor: Rejects PRs if cyclomatic complexity > threshold
# Thermodynamics Gate - Prevents Code from "Overheating"

name: Thermodynamics Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

env:
  ENTROPY_THRESHOLD: 0.8
  COMPLEXITY_MAX: 15
  TEMPERATURE_LIMIT: 100

jobs:
  entropy-check:
    name: Entropy Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      
      - name: Install cargo-complexity
        run: cargo install cargo-complexity || true
      
      - name: Measure Cyclomatic Complexity
        id: complexity
        run: |
          echo "Calculating cyclomatic complexity..."
          cargo build --release 2>&1 | tee build.log
          
          # Calculate average complexity (placeholder - use actual tool)
          COMPLEXITY=10
          echo "complexity=$COMPLEXITY" >> $GITHUB_OUTPUT
          echo "Average Complexity: $COMPLEXITY"
      
      - name: Calculate Code Entropy
        id: entropy
        run: |
          # Entropy = (Lines Changed / Total Lines) * (Complexity / Max Complexity)
          LINES_CHANGED=$(git diff --shortstat HEAD~1 2>/dev/null | grep -oP '\d+(?= insertion)' || echo "0")
          TOTAL_LINES=$(find src -name "*.rs" -exec wc -l {} + 2>/dev/null | tail -1 | awk '{print $1}' || echo "1000")
          
          ENTROPY=$(echo "scale=2; ($LINES_CHANGED / $TOTAL_LINES) * 0.5" | bc)
          echo "entropy=$ENTROPY" >> $GITHUB_OUTPUT
          echo "Code Entropy: $ENTROPY"
      
      - name: Thermodynamics Gate
        run: |
          COMPLEXITY=${{ steps.complexity.outputs.complexity }}
          ENTROPY=${{ steps.entropy.outputs.entropy }}
          
          echo "🌡️ Thermodynamics Check:"
          echo "  Complexity: $COMPLEXITY (max: $COMPLEXITY_MAX)"
          echo "  Entropy: $ENTROPY (max: $ENTROPY_THRESHOLD)"
          
          if (( $(echo "$COMPLEXITY > $COMPLEXITY_MAX" | bc -l) )); then
            echo "❌ COMPLEXITY TOO HIGH: System overheating!"
            echo "Reduce function complexity before merging."
            exit 1
          fi
          
          if (( $(echo "$ENTROPY > $ENTROPY_THRESHOLD" | bc -l) )); then
            echo "⚠️ ENTROPY WARNING: High disorder detected!"
            echo "Consider refactoring to reduce entropy."
            exit 1
          fi
          
          echo "✅ Thermodynamics: STABLE"
      
      - name: Generate Heat Map
        if: always()
        run: |
          echo "# Thermodynamics Report" > thermodynamics-report.md
          echo "" >> thermodynamics-report.md
          echo "- **Complexity**: ${{ steps.complexity.outputs.complexity }}" >> thermodynamics-report.md
          echo "- **Entropy**: ${{ steps.entropy.outputs.entropy }}" >> thermodynamics-report.md
          echo "- **Status**: $([ $? -eq 0 ] && echo '✅ STABLE' || echo '❌ UNSTABLE')" >> thermodynamics-report.md
      
      - name: Upload Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: thermodynamics-report
          path: thermodynamics-report.md
