# SYNAPSE-BUS AGENT SWARM
# Self-Hydrating Repository System
# Generated by genesis.py

version: '3.8'

services:
  # Invention I: Chat-to-Spec Ingestion Valve
  architect:
    image: python:3.9
    volumes:
      - ./:/repo
      - ./knowledge/bibliography:/knowledge
    command: python3 /repo/scripts/ingest_chat.py
    environment:
      - BLUEPRINT_PATH=/repo/blueprint.yaml
      - BIBLIOGRAPHY_PATH=/knowledge
    networks:
      - synapsebus
    
  # Invention III: Synaptic Knowledge Linker (The Mason)
  mason:
    image: ollama/ollama:latest  # The Inline LLM (Qwen2.5)
    volumes:
      - ./:/repo
      - ./knowledge/bibliography:/knowledge
    environment:
      - TARGET_DIR=/repo/src
      - LLM_MODEL=qwen2.5-coder
      - BIBLIOGRAPHY_PATH=/knowledge
    # This agent reads the 'seeds' created by genesis.py and populates code
    # by querying the Bibliography (PDFs/Obsidian).
    command: python3 /repo/scripts/hydrate_file.py
    networks:
      - synapsebus
    depends_on:
      - architect

  # Invention II: Holographic Docker Hub Methodology
  builder:
    image: docker:dind
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/repo
    environment:
      - HUB_USER=strategickhaos
      - ENTROPY_THRESHOLD=0.8
      - RIPLEY_GATES=calcination,solution,putrefaction
    # Methodology: Recursive Docker Build -> Entropy Check -> Push to Hub
    command: sh -c "echo 'Builder ready for Dockerization'"
    networks:
      - synapsebus
    depends_on:
      - mason

networks:
  synapsebus:
    driver: bridge
