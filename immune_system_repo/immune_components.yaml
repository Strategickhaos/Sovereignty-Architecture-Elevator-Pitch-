# Analysis and insights
analysis:
  total_components: 36
  survivors_count: 12
  wasted_count: 24
  
  survivor_pattern: |
    Survivors are dynamic, regulatory, flow and gating mechanisms:
    - Control logic (Scheduler, Control Unit, Cognitive Mapping)
    - Safety mechanisms (Danger Reset, Equilibrium Balancer)
    - Core processing (Quantum Gate Array, Processor Emulation)
    - Optimization (Optimization pass, Debug Gate)
    
  wasted_pattern: |
    Wasted paths are mostly coarse structural labels:
    - Anatomy labels (Skin, Sebum, Mucus membrane)
    - Holistic organs (nose/mouth/throat, Oral cavity)
    - Generic categories (Immune cell, Connective Tissue)
    - Big nouns without fine-grained control
    
  interpretation: |
    The system reinforces micro-dynamics and control logic,
    and prunes coarse category labels unless they're doing real work.
    
    This matches a thought pattern that cares about:
    - flows, gates, pivots, error-checks
    - prior evals, emulation
    - NOT official category names unless they plug into causal circuits
