test_vectors:
  - id: "sim_seq1"
    desc: "Inscription sim - Royal names"
    input: ["Pu-zu-r", "I-n-shu-shi-na-k", "Shi-l-ha-ha"]
    expected_sum: 1487
    breakdown: "Pu-zu-r=406 + I-n-shu-shi-na-k=731 + Shi-l-ha-ha=350 = 1487 (reduced 2)"
    script_type: "linear_elamite"
    
  - id: "sim_seq2"
    desc: "Enhanced vector - Geographic and divine names"
    input: ["E-ba-r-ti", "Na-pi-r-ri-sha", "Ha-ta-m-ti"]
    expected_sum: 2331
    breakdown: "E-ba-r-ti=618 + Na-pi-r-ri-sha=856 + Ha-ta-m-ti=857 = 2331 (reduced 9)"
    script_type: "linear_elamite"
    
  - id: "sim_seq3"
    desc: "Royal dynasty sequence"
    input: ["Kuk-Kirmash", "Hutelutush-Inshushinak", "Shilhak-Inshushinak", "Temti-Agun"]
    expected_sum: 4550
    breakdown: "Kuk-Kirmash=617 + Hutelutush-Inshushinak=1905 + Shilhak-Inshushinak=1113 + Temti-Agun=915 = 4550 (reduced 5)"
    script_type: "linear_elamite"
    
  - id: "proto_baseline"
    desc: "Proto-Cuneiform baseline - Accounting tokens"
    input: ["DU₇", "SAL", "SUH₃", "NIGIN", "ERIN"]
    expected_sum: 50
    breakdown: "DU₇=10 + SAL=10 + SUH₃=10 + NIGIN=10 + ERIN=10 = 50 (reduced 5)"
    script_type: "proto_cuneiform"
    
  - id: "proto_fragment2"
    desc: "Enhanced proto vector - Extended accounting"
    input: ["KU₆", "DIN", "BULUG", "NI₂", "IGI"]
    expected_sum: 75
    breakdown: "KU₆=15 + DIN=15 + BULUG=15 + NI₂=15 + IGI=15 = 75 (reduced 3)"
    script_type: "proto_cuneiform"
    
  - id: "mixed_analysis"
    desc: "Comparative analysis - Elamite vs Proto structure"
    elamite_input: ["Pu-zu-r", "Shi-l-ha-ha"]
    proto_input: ["ŠE", "UDU"]
    elamite_sum: 756
    proto_sum: 20
    delta: 736
    interpretation: "Higher structural complexity in Linear Elamite (logosyllabic vs pictographic)"

dna_encoding:
  sequence: "ATG-ELM-LIN-GMT-TRG"
  description: "Genetic encoding for Linear Elamite simulation pipeline"
  codon_map:
    ATG: "init_signs"
    ELM: "elamite_extract"
    LIN: "linear_map"
    GMT: "gematria_sum"
    TRG: "trig_project"
  mutations:
    - from: "LIN"
      to: "PRT"
      effect: "proto_cuneiform_baseline"
      risk: 0.05
      description: "Switch to Proto-Cuneiform baseline for comparison"
    - from: "GMT"
      to: "GMT2"
      effect: "enhanced_gematria_with_trig_scale"
      risk: 0.15
      description: "Apply tanh(tan θ) scaling for edge-case hardening"

wave_transform:
  base_frequency: 440
  description: "Neural tick clocks for sign sequence simulation"
  harmonics:
    sum_loop: 4
    project: 3
  phase:
    sum_to_project: 90
  tick_rate: 1
  trigger_conditions:
    invention_density: ">0.8"
    mutation_threshold: 0.67

trig6_parameters:
  theta_computation: "G(l) mod (2π)"
  resonance: "r = cos(θ)"
  drift: "d = sin(θ)"
  noise: "n = pictographic_noise ∈ [0.3, 0.7]"
  equivalence: "eq = vital_equivalence ∈ [0.4, 0.8]"
  fitness: "m = r · (1-d) · (1-n) · eq"
  danger_clamp: "tan infinity risk at θ=π/2"
  safeguard_threshold: 0.7

