# ============================================================
# RESPONSE ACTIONS
# ============================================================

response_actions:
  automatic:
    - action: "block_ip"
      triggers: ["Layer 25-30", "Layer 36"]
      api: "FIREWALL_API"
      
    - action: "terminate_session"
      triggers: ["Layer 01-06", "Layer 36"]
      api: "SESSION_SERVICE"
      
    - action: "revoke_token"
      triggers: ["Layer 01-06"]
      api: "IAM_API"
      
    - action: "rate_limit"
      triggers: ["Layer 31"]
      api: "RATE_LIMIT_API"
      
    - action: "quarantine_user"
      triggers: ["Layer 36"]
      api: "QUARANTINE_API"
      
  manual:
    - action: "investigate"
      severity: "CRITICAL"
      sla: "< 5 minutes"
      
    - action: "forensics"
      severity: "HIGH"
      sla: "< 15 minutes"
      
    - action: "review"
      severity: "MEDIUM"
      sla: "< 1 hour"

# ============================================================
# INTEGRATION REQUIREMENTS
# ============================================================

integrations:
  required:
    - name: "Slack"
      type: "notification"
      channels: ["#security-critical", "#security-high", "#security-medium", "#security-low"]
      
    - name: "Discord"
      type: "notification"
      server: "Strategickhaos-AI"
      channel: "#security"
      
    - name: "Airtable"
      type: "database"
      base: "Security_Operations"
      tables: ["Incident_Log", "Detection_Log", "Reconnaissance_Log"]
      
    - name: "Google Sheets"
      type: "spreadsheet"
      spreadsheet: "Reconnaissance_Log"
      sheets: ["Port_Scans", "DNS_Probes", "Robots_Access", "UA_Anomalies"]
      
    - name: "Webhooks"
      type: "automation"
      provider: "Zapier"
      
  optional:
    - name: "PagerDuty"
      type: "alerting"
      use_case: "Critical incident escalation"
      
    - name: "Splunk"
      type: "siem"
      use_case: "Advanced threat hunting"

# ============================================================
# DEPLOYMENT STATUS
# ============================================================

deployment:
  status: "READY_TO_DEPLOY"
  prerequisites_complete: true
  testing_required: true
  rollback_plan: true
  
documentation:
  deployment_guide: "DEPLOYMENT_GUIDE.md"
  testing_guide: "See DEPLOYMENT_GUIDE.md - Testing section"
  maintenance_guide: "See DEPLOYMENT_GUIDE.md - Maintenance section"
  incident_response: "See DEPLOYMENT_GUIDE.md - Incident Response Integration section"

# ============================================================
# NOTES
# ============================================================

notes:
  - "All webhook endpoints must be secured with signature verification"
  - "Environment variables must be stored in Zapier environment or HashiCorp Vault"
  - "Test each layer independently before full deployment"
  - "Canary tokens (Layer 36) require external service integration"
  - "Rate limiting thresholds should be tuned per environment"
  - "False positive rates should be monitored and detection rules adjusted"
