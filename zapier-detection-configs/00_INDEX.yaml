# ============================================================
# STRATEGICKHAOS 36-LAYER DETECTION MATRIX
# MASTER INDEX
# ============================================================

metadata:
  version: "1.0.0"
  last_updated: "2025-12-10"
  organization: "StrategicKhaos DAO LLC"
  description: "Master index for 36-layer honeypot detection system"
  deployment_target: "Zapier Workflows"

# ============================================================
# LAYER GROUPS
# ============================================================

layer_groups:
  authentication_tripwires:
    layers: "01-06"
    config_file: "layers_01-06_authentication.yaml"
    description: "OAuth, API token, and authentication monitoring"
    severity_range: "CRITICAL to HIGH"
    
  reconnaissance_detection:
    layers: "07-12"
    config_file: "layers_07-12_reconnaissance.yaml"
    description: "Port scans, DNS probes, robots.txt access"
    severity_range: "HIGH to MEDIUM"
    
  exfiltration_monitors:
    layers: "13-18"
    config_file: "layers_13-18_exfiltration.yaml"
    description: "Data dumps, file access, bulk operations"
    severity_range: "CRITICAL to HIGH"
    
  infrastructure_probes:
    layers: "19-24"
    config_file: "layers_19-24_infrastructure.yaml"
    description: "Docker, Kubernetes, SSH gateway access"
    severity_range: "HIGH to MEDIUM"
    
  injection_detection:
    layers: "25-30"
    config_file: "layers_25-30_injection.yaml"
    description: "SQL injection, XSS, command injection attempts"
    severity_range: "CRITICAL to HIGH"
    
  behavioral_anomalies:
    layers: "31-36"
    config_file: "layers_31-36_behavioral.yaml"
    description: "Rate limiting, user agents, canary tokens"
    severity_range: "CRITICAL to LOW"

# ============================================================
# ALERT ROUTING MATRIX
# ============================================================

alert_routing:
  critical:
    channels:
      - type: "slack"
        target: "#security-critical"
        workspace: "strategickhaos-rla5357.slack.com"
      - type: "discord"
        target: "Strategickhaos-AI #security"
        webhook: "DISCORD_SECURITY_WEBHOOK"
      - type: "airtable"
        target: "Incident_Log"
        base: "Security_Operations"
      - type: "email"
        target: "security@strategickhaos.ai"
    response_time: "< 5 minutes"
    
  high:
    channels:
      - type: "slack"
        target: "#security-high"
        workspace: "strategickhaos-rla5357.slack.com"
      - type: "airtable"
        target: "Incident_Log"
        base: "Security_Operations"
    response_time: "< 15 minutes"
    
  medium:
    channels:
      - type: "airtable"
        target: "Detection_Log"
        base: "Security_Operations"
      - type: "google_sheets"
        target: "Reconnaissance_Log"
    response_time: "< 1 hour"
    
  low:
    channels:
      - type: "google_sheets"
        target: "Reconnaissance_Log"
    response_time: "< 24 hours"

# ============================================================
