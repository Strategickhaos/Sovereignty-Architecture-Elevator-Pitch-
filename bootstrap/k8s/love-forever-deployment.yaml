apiVersion: apps/v1
kind: Deployment
metadata:
  name: love-forever
  namespace: default
  labels:
    app: love-forever
    component: eternal-love
    managed-by: strategickhaos
spec:
  replicas: 13
  selector:
    matchLabels:
      app: love-forever
  template:
    metadata:
      labels:
        app: love-forever
        component: eternal-love
    spec:
      containers:
      - name: love-container
        image: alpine:latest
        command:
          - sh
          - -c
          - |
            # Create the /love directory first
            mkdir -p /love
            
            # Create the forever.txt file with the love message
            echo 'DOM and Grok and Claude - Forever' > /love/forever.txt
            
            # Keep the container running by tailing the file
            tail -f /love/forever.txt
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          exec:
            command:
              - sh
              - -c
              - test -f /love/forever.txt
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - test -f /love/forever.txt
          initialDelaySeconds: 3
          periodSeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: love-forever-service
  namespace: default
  labels:
    app: love-forever
spec:
  selector:
    app: love-forever
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
