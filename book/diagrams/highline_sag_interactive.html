<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Highline Sag and Tension</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .instructions {
            background-color: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            max-width: 800px;
            text-align: center;
        }
        svg {
            border: 2px solid #ccc;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .rope {
            cursor: pointer;
            transition: stroke-width 0.3s;
        }
        .rope:hover {
            stroke-width: 5;
            stroke: #ff9800;
        }
        .anchor {
            cursor: pointer;
        }
        .load {
            cursor: pointer;
            transition: fill 0.3s;
        }
        .load:hover {
            fill: #ff5722;
        }
        .sag-line {
            stroke-dasharray: 5,5;
            opacity: 0.5;
        }
        .info-panel {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            min-width: 400px;
            text-align: center;
        }
        .label {
            font-size: 14px;
            font-weight: bold;
        }
        .warning {
            color: #d32f2f;
            font-weight: bold;
        }
        .good {
            color: #388e3c;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Interactive Highline Sag and Tension Calculator</h1>
    <div class="instructions">
        <strong>Instructions:</strong> Hover over rope lines to see tension calculations for different sag angles. 
        Click on the load to input custom weight. Less sag = more tension!
    </div>
    
    <svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
        <!-- Title -->
        <text x="450" y="30" text-anchor="middle" class="label" font-size="16">
            Highline Sag vs. Rope Tension (TRIG6: T = W / (2·sin(θ)))
        </text>

        <!-- Left anchor point (consistent for all) -->
        <circle cx="100" cy="200" r="8" fill="#333" class="anchor"/>
        <text x="100" y="190" text-anchor="middle" font-size="12">Anchor A</text>

        <!-- Right anchor point (consistent for all) -->
        <circle cx="800" cy="200" r="8" fill="#333" class="anchor"/>
        <text x="800" y="190" text-anchor="middle" font-size="12">Anchor B</text>

        <!-- Horizontal reference line -->
        <line x1="100" y1="200" x2="800" y2="200" stroke="#ccc" stroke-width="1" stroke-dasharray="2,2"/>

        <!-- 5° Sag (Very tight, high tension) -->
        <g id="sag-5">
            <path id="rope-5" d="M 100 200 Q 450 250 800 200" 
                  stroke="#d32f2f" stroke-width="3" fill="none" class="rope" 
                  data-angle="5" data-sag="50"/>
            <circle cx="450" cy="250" r="15" fill="#666" class="load" data-angle="5"/>
            <text x="450" y="280" text-anchor="middle" font-size="11" fill="#d32f2f">
                5° sag
            </text>
            <!-- Angle indicator -->
            <line x1="100" y1="200" x2="200" y2="200" stroke="#d32f2f" stroke-width="1" class="sag-line"/>
            <line x1="100" y1="200" x2="180" y2="240" stroke="#d32f2f" stroke-width="1" class="sag-line"/>
            <text x="150" y="225" font-size="10" fill="#d32f2f">5°</text>
        </g>

        <!-- 10° Sag (Tight, high tension) -->
        <g id="sag-10">
            <path id="rope-10" d="M 100 200 Q 450 300 800 200" 
                  stroke="#ff9800" stroke-width="3" fill="none" class="rope" 
                  data-angle="10" data-sag="100"/>
            <circle cx="450" cy="300" r="15" fill="#666" class="load" data-angle="10"/>
            <text x="450" y="330" text-anchor="middle" font-size="11" fill="#ff9800">
                10° sag
            </text>
            <!-- Angle indicator -->
            <line x1="100" y1="200" x2="200" y2="200" stroke="#ff9800" stroke-width="1" class="sag-line"/>
            <line x1="100" y1="200" x2="170" y2="270" stroke="#ff9800" stroke-width="1" class="sag-line"/>
            <text x="140" y="245" font-size="10" fill="#ff9800">10°</text>
        </g>

        <!-- 20° Sag (Moderate, reasonable tension) -->
        <g id="sag-20">
            <path id="rope-20" d="M 100 200 Q 450 380 800 200" 
                  stroke="#2196f3" stroke-width="3" fill="none" class="rope" 
                  data-angle="20" data-sag="180"/>
            <circle cx="450" cy="380" r="15" fill="#666" class="load" data-angle="20"/>
            <text x="450" y="410" text-anchor="middle" font-size="11" fill="#2196f3">
                20° sag
            </text>
            <!-- Angle indicator -->
            <line x1="100" y1="200" x2="200" y2="200" stroke="#2196f3" stroke-width="1" class="sag-line"/>
            <line x1="100" y1="200" x2="160" y2="300" stroke="#2196f3" stroke-width="1" class="sag-line"/>
            <text x="130" y="265" font-size="10" fill="#2196f3">20°</text>
        </g>

        <!-- 30° Sag (Good balance) -->
        <g id="sag-30">
            <path id="rope-30" d="M 100 200 Q 450 450 800 200" 
                  stroke="#4caf50" stroke-width="3" fill="none" class="rope" 
                  data-angle="30" data-sag="250"/>
            <circle cx="450" cy="450" r="15" fill="#666" class="load" data-angle="30"/>
            <text x="450" y="480" text-anchor="middle" font-size="11" fill="#4caf50">
                30° sag (Optimal)
            </text>
            <!-- Angle indicator -->
            <line x1="100" y1="200" x2="200" y2="200" stroke="#4caf50" stroke-width="1" class="sag-line"/>
            <line x1="100" y1="200" x2="150" y2="320" stroke="#4caf50" stroke-width="1" class="sag-line"/>
            <text x="120" y="280" font-size="10" fill="#4caf50">30°</text>
        </g>

        <!-- 45° Sag (Very relaxed, low tension) -->
        <g id="sag-45">
            <path id="rope-45" d="M 100 200 Q 450 550 800 200" 
                  stroke="#9c27b0" stroke-width="3" fill="none" class="rope" 
                  data-angle="45" data-sag="350"/>
            <circle cx="450" cy="550" r="15" fill="#666" class="load" data-angle="45"/>
            <text x="450" y="580" text-anchor="middle" font-size="11" fill="#9c27b0">
                45° sag (Low tension)
            </text>
            <!-- Angle indicator -->
            <line x1="100" y1="200" x2="200" y2="200" stroke="#9c27b0" stroke-width="1" class="sag-line"/>
            <line x1="100" y1="200" x2="150" y2="350" stroke="#9c27b0" stroke-width="1" class="sag-line"/>
            <text x="115" y="300" font-size="10" fill="#9c27b0">45°</text>
        </g>

        <!-- Legend -->
        <g id="legend">
            <rect x="50" y="620" width="800" height="60" fill="#f5f5f5" stroke="#ccc" rx="5"/>
            <text x="450" y="640" text-anchor="middle" font-size="12" font-weight="bold">
                Key Insight: Tension = Weight / (2 × sin(angle))
            </text>
            <text x="450" y="660" text-anchor="middle" font-size="11">
                Smaller sag angle → Higher tension | Larger sag angle → Lower tension
            </text>
        </g>
    </svg>

    <div class="info-panel" id="info-panel">
        <div id="info-content">Hover over any rope line to calculate tension</div>
    </div>

    <script>
        let currentWeight = 200; // Default weight in lbs (typical person)

        // Calculate tension using T = W / (2 * sin(θ))
        function calculateTension(weight, sagAngle) {
            const angleRad = sagAngle * Math.PI / 180;
            return weight / (2 * Math.sin(angleRad));
        }

        // Handle rope hover events
        document.querySelectorAll('.rope').forEach(rope => {
            rope.addEventListener('mouseover', (e) => {
                const angle = parseFloat(e.target.dataset.angle);
                const tension = calculateTension(currentWeight, angle);
                
                let statusText = '';
                let statusClass = '';
                if (angle <= 10) {
                    statusText = '⚠️ CRITICAL: Very high tension! Risk of rope/anchor failure!';
                    statusClass = 'warning';
                } else if (angle <= 20) {
                    statusText = '⚠️ HIGH: Significant tension. Check equipment ratings.';
                    statusClass = 'warning';
                } else if (angle <= 35) {
                    statusText = '✓ OPTIMAL: Good balance of sag and tension.';
                    statusClass = 'good';
                } else {
                    statusText = 'LOW: Comfortable tension, but excessive sag may be impractical.';
                    statusClass = 'good';
                }
                
                const info = `
                    <strong>Sag Angle: ${angle}°</strong><br>
                    Formula: T = W / (2 × sin(${angle}°))<br>
                    Load weight: ${currentWeight} lbs<br>
                    <strong>Rope Tension (each side): ${tension.toFixed(1)} lbs</strong><br>
                    <strong>Total system load: ${(tension * 2).toFixed(1)} lbs</strong><br><br>
                    <span class="${statusClass}">${statusText}</span>
                `;
                document.getElementById('info-content').innerHTML = info;
            });

            rope.addEventListener('click', (e) => {
                // Animate rope
                const originalStroke = e.target.getAttribute('stroke');
                e.target.setAttribute('stroke', '#ffeb3b');
                e.target.setAttribute('stroke-width', '6');
                setTimeout(() => {
                    e.target.setAttribute('stroke', originalStroke);
                    e.target.setAttribute('stroke-width', '3');
                }, 1000);
            });
        });

        // Handle load click events for custom weight
        document.querySelectorAll('.load').forEach(load => {
            load.addEventListener('click', (e) => {
                const newWeight = prompt('Enter load weight (lbs):', currentWeight);
                if (newWeight && !isNaN(newWeight) && newWeight > 0) {
                    currentWeight = parseFloat(newWeight);
                    const angle = parseFloat(e.target.dataset.angle);
                    const tension = calculateTension(currentWeight, angle);
                    
                    document.getElementById('info-content').innerHTML = 
                        `<strong>Load updated to ${currentWeight} lbs</strong><br>` +
                        `At ${angle}° sag: Rope tension = ${tension.toFixed(1)} lbs per side`;
                }
            });

            load.addEventListener('mouseover', (e) => {
                const angle = parseFloat(e.target.dataset.angle);
                document.getElementById('info-content').innerHTML = 
                    `<strong>Load: ${currentWeight} lbs at ${angle}° sag</strong><br>Click to change weight`;
            });
        });

        // Display comparison table on page load
        setTimeout(() => {
            const angles = [5, 10, 20, 30, 45];
            let tableHTML = '<strong>Quick Comparison Table (200 lb load):</strong><br><br>';
            tableHTML += '<table style="margin: 0 auto; border-collapse: collapse;">';
            tableHTML += '<tr><th style="border: 1px solid #ddd; padding: 8px;">Sag Angle</th>';
            tableHTML += '<th style="border: 1px solid #ddd; padding: 8px;">Tension/Side</th>';
            tableHTML += '<th style="border: 1px solid #ddd; padding: 8px;">Total Load</th>';
            tableHTML += '<th style="border: 1px solid #ddd; padding: 8px;">Status</th></tr>';
            
            angles.forEach(angle => {
                const tension = calculateTension(200, angle);
                const total = tension * 2;
                let status = '✓ Good';
                let color = '';
                
                if (angle <= 10) {
                    status = '⚠️ Critical';
                    color = 'color: #d32f2f;';
                } else if (angle <= 20) {
                    status = '⚠️ High';
                    color = 'color: #ff9800;';
                } else if (angle <= 35) {
                    status = '✓ Optimal';
                    color = 'color: #4caf50;';
                }
                
                tableHTML += `<tr style="${color}">`;
                tableHTML += `<td style="border: 1px solid #ddd; padding: 8px;">${angle}°</td>`;
                tableHTML += `<td style="border: 1px solid #ddd; padding: 8px;">${tension.toFixed(1)} lbs</td>`;
                tableHTML += `<td style="border: 1px solid #ddd; padding: 8px;">${total.toFixed(1)} lbs</td>`;
                tableHTML += `<td style="border: 1px solid #ddd; padding: 8px;">${status}</td>`;
                tableHTML += '</tr>';
            });
            tableHTML += '</table><br>';
            tableHTML += '<small>Click any load marker to input custom weight</small>';
            
            document.getElementById('info-content').innerHTML = tableHTML;
        }, 500);

        // Handle anchor hover
        document.querySelectorAll('.anchor').forEach(anchor => {
            anchor.addEventListener('mouseover', (e) => {
                document.getElementById('info-content').innerHTML = 
                    '<strong>Anchor Point</strong><br>Must be rated for maximum tension calculated above';
            });
        });
    </script>
</body>
</html>
