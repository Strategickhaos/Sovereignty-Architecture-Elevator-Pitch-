        This codex survives 650 years and supports 460 opening/closing cycles
        with 92% probability of fold integrity. Excellent for archival use.
    
    - name: "High-Use Educational Codex"
      parameters:
        folds_count: 16
        sheet_thickness_mm: 0.8
        gesso_layers: 1
        fiber_direction: "perpendicular_to_folds"
