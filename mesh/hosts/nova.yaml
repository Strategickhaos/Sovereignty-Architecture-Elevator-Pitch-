# SAGCO Neural Mesh Node: Nova
# Role: Left Hemisphere (Mobile Compute Node)
# Version: 1.0.0

node:
  id: "nova"
  name: "Nova"
  role: "left_hemisphere"
  priority: 7  # High priority mobile node
  
hardware:
  cpu:
    model: "Intel Mobile"
    cores: 4
    threads: 8
  
  memory:
    size: "16 GB"
    type: "DDR4"
  
  storage:
    - type: "SSD"
      size: "512 GB"
      mount: "/"

network:
  primary:
    interface: "wlan0"
    type: "WiFi 6"
    chipset: "Intel Wi-Fi 6 AX203"
    ip: "192.168.1.25"
    band: "5GHz"
  
  ports:
    - 22    # SSH
    - 8080  # SAGCO API

services:
  sagco_kernel:
    enabled: true
    version: "1.0.6"
    config:
      cognitive_loop_interval: "200ms"
      bloom_filter_size: 100000
  
  mesh_sync:
    enabled: true
    protocol: "crdt"
    sync_interval: "2s"
  
  oracle:
    enabled: false  # Lightweight node

capabilities:
  - mobile_compute
  - wifi_mesh
  - logical_processing
  - analytical_reasoning

metadata:
  location: "Mobile"
  owner: "Domenic Gabriel Garza"
  deployed: "2025-01-18"
  dna_codon: "MESH5"
  mesh_version: "5.0"
