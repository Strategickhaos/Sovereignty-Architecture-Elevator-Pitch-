# Export & Sync Schema
# Sovereign Cognitive Architecture
# Version: 1.0.0

metadata:
  title: "Sovereign Export & Sync Schema"
  description: "Full data sovereignty with cryptographic provenance"
  version: "1.0.0"
  last_updated: "2025-12-07"
  principle: "Your data, your control, forever"

# ============================================================================
# EXPORT FORMATS
# ============================================================================

export_formats:
  json:
    extension: ".json"
    mime_type: "application/json"
    description: "Standard structured data"
    use_cases:
      - "API integration"
      - "Web applications"
      - "Data interchange"
    compression_support: true
    streaming_support: true
    
    structure:
      metadata:
        export_id: "uuid"
        timestamp: "ISO 8601 datetime"
        operator: "string"
        version: "semver"
      conversations: "array"
      knowledge_base: "array"
      audit_trail: "array"
      provenance:
        git_commit: "sha256"
        gpg_signature: "string"
        opentimestamp: "string"
        
  yaml:
    extension: ".yaml"
    mime_type: "application/x-yaml"
    description: "Human-readable configuration"
    use_cases:
      - "Configuration management"
      - "Documentation"
      - "Version control"
    compression_support: true
    streaming_support: false
    
  markdown:
    extension: ".md"
    mime_type: "text/markdown"
    description: "Documentation format"
    use_cases:
      - "Human reading"
      - "GitHub display"
      - "Knowledge base articles"
    compression_support: true
    streaming_support: false
    
  sqlite:
    extension: ".db"
    mime_type: "application/x-sqlite3"
    description: "Portable database"
    use_cases:
      - "SQL queries"
      - "Relational analysis"
      - "Offline access"
    compression_support: true
    streaming_support: false
    
    schema:
      tables:
        - conversations
        - messages
        - knowledge_entities
        - verification_results
        - audit_log
      indexes:
        - conversation_id
        - llm_provider
        - timestamp
        - entity_type
        
  parquet:
    extension: ".parquet"
    mime_type: "application/x-parquet"
    description: "Analytics-ready columnar format"
    use_cases:
      - "Data science"
      - "Analytics pipelines"
      - "Big data processing"
    compression_support: true  # Built-in Snappy
    streaming_support: true
    
  csv:
    extension: ".csv"
    mime_type: "text/csv"
    description: "Simple tabular data"
    use_cases:
      - "Excel import"
      - "Data analysis"
      - "Simple processing"
    compression_support: true
    streaming_support: true

# ============================================================================
# COMPRESSION OPTIONS
# ============================================================================

compression:
  none:
    algorithm: null
    extension: ""
    ratio: 1.0
    speed: "instant"
    
  gzip:
    algorithm: "gzip"
    extension: ".gz"
    ratio: 3-5
    speed: "fast"
    recommended_for:
      - "json"
      - "yaml"
      - "markdown"
      
  bzip2:
    algorithm: "bzip2"
    extension: ".bz2"
    ratio: 4-6
    speed: "medium"
    recommended_for:
      - "Large text files"
      
  xz:
    algorithm: "xz (LZMA2)"
    extension: ".xz"
    ratio: 5-8
    speed: "slow"
    recommended_for:
      - "Maximum compression"
      - "Long-term archival"

# ============================================================================
# CRYPTOGRAPHIC INTEGRITY
# ============================================================================

cryptography:
  hashing:
    algorithm: "SHA-256"
    output_format: "hexadecimal"
    purpose: "Content integrity verification"
    
    implementation: |
      import hashlib
      
      def hash_content(data: bytes) -> str:
          return hashlib.sha256(data).hexdigest()
    
  gpg_signing:
    algorithm: "RSA 4096-bit"
    key_format: "OpenPGP"
    signature_type: "detached"
    
    workflow:
      - step: 1
        action: "Generate export file"
      - step: 2
        action: "Calculate SHA-256 hash"
      - step: 3
        action: "Sign hash with GPG private key"
      - step: 4
        action: "Attach signature to export"
        
    verification: |
      # Verify GPG signature
      gpg --verify export.json.sig export.json
      
      # Expected output:
      # gpg: Signature made [timestamp]
      # gpg: Good signature from "DOM_010101 <operator@strategickhaos.com>"
      
  opentimestamps:
    protocol: "OpenTimestamps v1"
    blockchain: "Bitcoin"
    standard: "RFC 3161"
    
    workflow:
      - step: 1
        action: "Calculate SHA-256 hash of export"
      - step: 2
        action: "Submit hash to OpenTimestamps server"
      - step: 3
        action: "Receive timestamp proof (.ots file)"
      - step: 4
        action: "Wait for Bitcoin block confirmation"
      - step: 5
        action: "Proof becomes verifiable on blockchain"
        
    verification: |
      # Verify OpenTimestamps proof
      ots verify export.json.ots
      
      # Expected output:
      # Success! Bitcoin block [height] attests existence as of [timestamp]
      
    benefits:
      - "Immutable proof of existence"
      - "Decentralized verification"
      - "Cannot be forged or backdated"
      - "Survives organizational changes"

# ============================================================================
# PROVENANCE METADATA
# ============================================================================

provenance:
  required_fields:
    export_id:
      type: "uuid"
      description: "Unique identifier for this export"
      
    timestamp:
      type: "ISO 8601 datetime"
      description: "When export was created"
      example: "2025-12-07T04:54:55.543Z"
      
    operator:
      type: "string"
      description: "Who initiated the export"
      example: "DOM_010101"
      
    organization:
      type: "string"
      description: "Organization name"
      example: "Strategickhaos DAO LLC"
      
    ein:
      type: "string"
      description: "Employer Identification Number"
      example: "39-2923503"
      
  optional_fields:
    conversation_id:
      type: "string"
      description: "Specific conversation exported (if filtered)"
      
    llm_provider:
      type: "string"
      description: "Filter by LLM provider"
      
    date_range:
      type: "object"
      properties:
        start: "datetime"
        end: "datetime"
        
    verification_scores:
      type: "object"
      description: "Quadrilateral verification results"
      properties:
        symbolic: "float"
        spatial: "float"
        narrative: "float"
        kinetic: "float"
        
    git_metadata:
      type: "object"
      properties:
        commit_sha: "string"
        branch: "string"
        repository: "string"
        
  computed_fields:
    content_hash:
      type: "SHA-256 hex"
      description: "Hash of export content"
      
    file_size_bytes:
      type: "integer"
      description: "Size of export file"
      
    conversation_count:
      type: "integer"
      description: "Number of conversations exported"
      
    message_count:
      type: "integer"
      description: "Total messages exported"
      
    gpg_signature:
      type: "string"
      description: "GPG signature of content hash"
      
    opentimestamp_proof:
      type: "string"
      description: "OpenTimestamps proof URL"

# ============================================================================
# EXPORT STRUCTURE
# ============================================================================

