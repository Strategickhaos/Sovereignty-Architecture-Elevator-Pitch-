# ============================================================================
# SYNC PROTOCOL
# ============================================================================

sync_protocol:
  method: "git-based"
  description: |
    Each LLM session creates a branch. Verified conversations are merged
    to main via quadrilateral consensus. Git provides natural version
    control and conflict resolution.
    
  branch_strategy:
    main:
      description: "Production-verified conversations only"
      protection: "Require 3/4 quadrilateral votes to merge"
      
    llm_sessions:
      pattern: "session/{llm_provider}/{session_id}"
      example: "session/claude/sess_123"
      lifecycle:
        - "Create branch on first message"
        - "Commit each conversation turn"
        - "Run quadrilateral verification"
        - "Merge to main if verified (3/4 or 4/4)"
        - "Delete branch after merge or archive"
        
    feature_branches:
      pattern: "feature/{feature_name}"
      example: "feature/knowledge-graph-enhancement"
      
  commit_workflow:
    auto_commit:
      enabled: true
      frequency: "per_conversation_turn"
      
    commit_message_format: |
      {llm_provider}: {summary}
      
      Session: {session_id}
      Messages: {message_count}
      Verification: {votes}
      
      Signed-off-by: {operator}
      
    gpg_signing:
      enabled: true
      require_signature: true
      key_id: "${GPG_KEY_ID}"
      
  merge_strategy:
    method: "quadrilateral_consensus"
    
    requirements:
      - "3/4 or 4/4 verification votes"
      - "No merge conflicts"
      - "GPG signature present"
      - "CI tests pass (if configured)"
      
    conflict_resolution:
      automatic:
        - "Non-overlapping conversations: auto-merge"
        - "Different LLM providers: auto-merge"
        
      manual:
        - "Same conversation from multiple LLMs: human review"
        - "Conflicting knowledge claims: re-verify"
        
  sync_frequency:
    real_time:
      enabled: true
      mechanism: "Git hooks"
      trigger: "post-commit"
      
    batch:
      enabled: false
      interval: "hourly"
      
    on_demand:
      enabled: true
      api_endpoint: "/sync/push"

# ============================================================================
# ANTIFRAGILE AUDIT LAYER
# ============================================================================

audit_layer:
  description: |
    Multi-layer redundancy ensures data survives organizational changes,
    platform migrations, and long-term preservation needs.
    
  layers:
    layer_1:
      name: "Real-time Operations"
      provider: "Airtable"
      purpose: "Live operational dashboard"
      retention: "90 days"
      export_frequency: "daily"
      data_types:
        - "Conversation metadata"
        - "LLM usage metrics"
        - "Verification scores"
        - "Operator actions"
        
    layer_2:
      name: "Version Control"
      provider: "GitHub"
      purpose: "Git history with GPG signatures"
      retention: "forever"
      export_frequency: "real-time"
      data_types:
        - "Full conversation history"
        - "Knowledge base snapshots"
        - "Audit trail"
        - "Provenance metadata"
        
    layer_3:
      name: "Immutable Proof"
      provider: "OpenTimestamps + Bitcoin"
      purpose: "Blockchain-anchored proof of existence"
      retention: "forever (on blockchain)"
      export_frequency: "daily"
      data_types:
        - "Content hashes"
        - "Timestamp proofs"
        - "Merkle tree commitments"
        
    layer_4:
      name: "Legal Archive"
      provider: "Local filesystem + Cloud backup"
      purpose: "Legal compliance and board minutes"
      retention: "forever"
      export_frequency: "monthly"
      data_types:
        - "Board meeting minutes"
        - "Legal filings"
        - "Compliance reports"
        - "Full system exports"
        
  redundancy:
    geographic:
      - "Primary: Local SSD"
      - "Secondary: Cloud storage (S3, GCS, etc.)"
      - "Tertiary: Physical backup drives"
      
    format:
      - "Native: Qdrant + Redis"
      - "Export: JSON, SQLite, Parquet"
      - "Archive: Compressed + encrypted tarballs"

# ============================================================================
# EXPORT API
# ============================================================================

export_api:
  endpoint: "/export"
  method: "POST"
  
  request:
    format:
      type: "string"
      required: true
      enum: ["json", "yaml", "markdown", "sqlite", "parquet", "csv"]
      
    compression:
      type: "string"
      required: false
      enum: ["none", "gzip", "bzip2", "xz"]
      default: "gzip"
      
    gpg_sign:
      type: "boolean"
      required: false
      default: true
      
    opentimestamps:
      type: "boolean"
      required: false
      default: true
      
    include_audit_trail:
      type: "boolean"
      required: false
      default: true
      
    filters:
      type: "object"
      required: false
      properties:
        llm_providers:
          type: "array[string]"
        conversation_ids:
          type: "array[string]"
        date_range:
          type: "object"
          properties:
            start: "datetime"
            end: "datetime"
        min_verification_score:
          type: "float"
        tags:
          type: "array[string]"
          
  response:
    status: 200
    content_type: "application/octet-stream"
    headers:
      Content-Disposition: "attachment; filename=cognitive_export_{timestamp}.{format}.{compression}"
      X-Export-ID: "uuid"
      X-Content-Hash: "SHA-256"
      X-GPG-Signature: "string (if enabled)"
      X-OpenTimestamps: "string (if enabled)"
      
  example_request: |
    curl -X POST http://localhost:7000/export \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer ${API_KEY}" \
      -d '{
        "format": "json",
        "compression": "gzip",
        "gpg_sign": true,
        "opentimestamps": true,
        "include_audit_trail": true,
        "filters": {
          "llm_providers": ["claude", "gpt"],
          "date_range": {
            "start": "2025-12-01T00:00:00Z",
            "end": "2025-12-07T23:59:59Z"
          },
          "min_verification_score": 0.75
        }
      }' \
      --output cognitive_export_2025-12-07.json.gz

  example_verification: |
    # 1. Decompress
    gunzip cognitive_export_2025-12-07.json.gz
    
    # 2. Verify content hash
    sha256sum cognitive_export_2025-12-07.json
    # Compare with X-Content-Hash header
    
    # 3. Verify GPG signature (if present)
    gpg --verify cognitive_export_2025-12-07.json.sig cognitive_export_2025-12-07.json
    
    # 4. Verify OpenTimestamps proof (if present)
    ots verify cognitive_export_2025-12-07.json.ots

# ============================================================================
# IMPORT API
# ============================================================================

import_api:
  endpoint: "/import"
  method: "POST"
  content_type: "multipart/form-data"
  
  description: |
    Import previously exported data back into the memory mesh.
    Supports full restoration or selective import.
    
  request:
    file:
      type: "file"
      required: true
      description: "Export file (any supported format)"
      
    verify_signatures:
      type: "boolean"
      required: false
      default: true
      
    merge_strategy:
      type: "string"
      required: false
      enum: ["append", "replace", "merge"]
      default: "append"
      
  response:
    status: 200
    body:
      import_id: "uuid"
      conversations_imported: "integer"
      knowledge_entities_imported: "integer"
      audit_entries_imported: "integer"
      warnings: "array[string]"
      errors: "array[string]"

