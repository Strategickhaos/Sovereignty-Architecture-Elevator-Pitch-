    - "Verify compliance: curl https://neurograph.sagco.local/api/compliance"
    
  maintenance:
    - "Regular DNA validation: sagco-cli validate-dna"
    - "Health check: sagco-cli health-report"
    - "Audit log integrity: sagco-cli verify-audit-trail"
    
  upgrades:
    - "DNA evolution requires member approval"
    - "New codons added via formal governance vote"
    - "Boot sequence updates tested in staging environment"
    
  documentation:
    - "Full technical documentation: /opt/sagco/docs/"
    - "Legal compliance guide: /opt/sagco/docs/legal/"
    - "Member handbook: /opt/sagco/docs/member_handbook.pdf"

