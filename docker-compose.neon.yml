version: '3.8'

# Neon Database Configuration for Refinory
# This compose file uses Neon's serverless PostgreSQL instead of local PostgreSQL
# Get your connection string from: https://console.neon.tech/app/org-snowy-moon-53031065/projects

networks:
  strategickhaos_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  refinory_artifacts:
  refinory_outputs:
  refinory_models:
  redis_data:
  qdrant_data:
  grafana_data:
  prometheus_data:

services:
  # Core Refinory Services
  refinory-api:
    build:
      context: .
      dockerfile: Dockerfile.refinory
      args:
        GPU_SUPPORT: "false"
    container_name: refinory-api
    ports:
      - "8085:8085"
    environment:
      # Use Neon database connection (set in .env)
      - REFINORY_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_DSN=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - LOG_LEVEL=INFO
    volumes:
      - refinory_artifacts:/var/refinory/artifacts
      - refinory_outputs:/var/refinory/outputs
      - refinory_models:/var/refinory/models
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - strategickhaos_network
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  refinory-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.refinory
      args:
        GPU_SUPPORT: "false"
    container_name: refinory-orchestrator
    ports:
      - "8081:8081"
    environment:
      - REFINORY_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_DSN=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - MAX_WORKERS=4
      - MAX_CONCURRENCY=16
      - LOG_LEVEL=INFO
    volumes:
      - refinory_artifacts:/var/refinory/artifacts
      - refinory_outputs:/var/refinory/outputs
      - refinory_models:/var/refinory/models
    networks:
      - strategickhaos_network
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "refinory.orchestrator"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Infrastructure Services (No local PostgreSQL - using Neon)
  redis:
    image: redis:7.2-alpine
    container_name: refinory-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - strategickhaos_network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: refinory-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - strategickhaos_network
    restart: unless-stopped

  # Monitoring & Observability
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: refinory-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - strategickhaos_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: refinory-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=refinory123
      - GF_INSTALL_PLUGINS=redis-datasource,postgres-datasource
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
    networks:
      - strategickhaos_network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Vector Database UI (optional)
  qdrant-web-ui:
    image: qdrant/qdrant-web-ui:latest
    container_name: refinory-qdrant-ui
    ports:
      - "3002:80"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    networks:
      - strategickhaos_network
    depends_on:
      - qdrant
    restart: unless-stopped
