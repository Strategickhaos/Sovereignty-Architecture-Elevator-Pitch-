<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Figure 9-1: Deviation Angles and Force Amplification -->
  <title>Deviation Angles and Force Amplification</title>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial, sans-serif">
    Figure 9-1: Deviation Angles and Force Amplification
  </text>
  
  <!-- Vertical reference (0 degrees) -->
  <g transform="translate(150, 150)">
    <text x="0" y="-20" font-size="16" font-weight="bold" text-anchor="middle">0° (Vertical)</text>
    <!-- Anchor -->
    <circle cx="0" cy="0" r="8" fill="#333"/>
    <!-- Rope -->
    <line x1="0" y1="0" x2="0" y2="120" stroke="#0066cc" stroke-width="3"/>
    <!-- Load -->
    <rect x="-10" y="120" width="20" height="30" fill="#cc0000"/>
    <text x="0" y="175" text-anchor="middle" font-size="14">sec(0°) = 1.00</text>
    <text x="0" y="195" text-anchor="middle" font-size="14" fill="#00aa00">Force: 1.0× Load</text>
  </g>
  
  <!-- 30 degree deviation -->
  <g transform="translate(350, 150)">
    <text x="0" y="-20" font-size="16" font-weight="bold" text-anchor="middle">30° Deviation</text>
    <!-- Anchor -->
    <circle cx="0" cy="0" r="8" fill="#333"/>
    <!-- Rope (angled) -->
    <line x1="0" y1="0" x2="69" y2="120" stroke="#0066cc" stroke-width="3"/>
    <!-- Angle arc -->
    <path d="M 0 30 A 30 30 0 0 1 15 56" fill="none" stroke="#666" stroke-width="1.5"/>
    <text x="20" y="50" font-size="12">30°</text>
    <!-- Load -->
    <rect x="59" y="120" width="20" height="30" fill="#cc0000"/>
    <text x="69" y="175" text-anchor="middle" font-size="14">sec(30°) = 1.15</text>
    <text x="69" y="195" text-anchor="middle" font-size="14" fill="#ff6600">Force: 1.15× Load</text>
  </g>
  
  <!-- 60 degree deviation -->
  <g transform="translate(550, 150)">
    <text x="0" y="-20" font-size="16" font-weight="bold" text-anchor="middle">60° Deviation</text>
    <!-- Anchor -->
    <circle cx="0" cy="0" r="8" fill="#333"/>
    <!-- Rope (more angled) -->
    <line x1="0" y1="0" x2="138" y2="80" stroke="#0066cc" stroke-width="3"/>
    <!-- Angle arc -->
    <path d="M 0 30 A 30 30 0 0 1 26 45" fill="none" stroke="#666" stroke-width="1.5"/>
    <text x="35" y="40" font-size="12">60°</text>
    <!-- Load -->
    <rect x="128" y="80" width="20" height="30" fill="#cc0000"/>
    <text x="138" y="135" text-anchor="middle" font-size="14">sec(60°) = 2.00</text>
    <text x="138" y="155" text-anchor="middle" font-size="14" fill="#cc0000">Force: 2.0× Load</text>
  </g>
  
  <!-- Field Pattern Box -->
  <g transform="translate(50, 380)">
    <rect width="700" height="180" fill="#fff3cd" stroke="#856404" stroke-width="2" rx="5"/>
    <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold">FIELD PATTERN — Angle Amplification</text>
    
    <text x="30" y="60" font-size="14">
      <tspan x="30" dy="0" font-weight="bold">What it is:</tspan>
      <tspan x="30" dy="20">As rope deviates from vertical, tension increases by sec(θ)</tspan>
      
      <tspan x="30" dy="35" font-weight="bold">What it does:</tspan>
      <tspan x="30" dy="20">At 60°, tension doubles; at 75°, tension nearly quadruples</tspan>
      
      <tspan x="30" dy="35" font-weight="bold">What to do about it:</tspan>
      <tspan x="30" dy="20">Route ropes vertically when possible; avoid shallow angles near horizontal</tspan>
    </text>
  </g>
</svg>
