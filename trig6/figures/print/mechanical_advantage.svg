<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Figure 4-1: Mechanical Advantage Systems -->
  <title>Mechanical Advantage in Rope Systems</title>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial, sans-serif">
    Figure 4-1: Mechanical Advantage Systems
  </text>
  
  <!-- Simple MA System (2:1) -->
  <g transform="translate(150, 100)">
    <text x="0" y="-10" font-size="16" font-weight="bold">2:1 System</text>
    <!-- Anchor -->
    <circle cx="0" cy="0" r="8" fill="#333"/>
    <!-- Rope -->
    <line x1="0" y1="0" x2="0" y2="150" stroke="#0066cc" stroke-width="3"/>
    <line x1="0" y1="150" x2="80" y2="150" stroke="#0066cc" stroke-width="3"/>
    <line x1="80" y1="150" x2="80" y2="0" stroke="#0066cc" stroke-width="3"/>
    <!-- Pulley -->
    <circle cx="0" cy="150" r="12" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Load -->
    <rect x="70" y="0" width="20" height="30" fill="#cc0000"/>
    <text x="80" y="-10" text-anchor="middle" font-size="14">Load</text>
    <!-- Force arrows -->
    <path d="M 90 75 L 120 75" stroke="#00aa00" stroke-width="2" marker-end="url(#arrowgreen)"/>
    <text x="135" y="80" font-size="14" fill="#00aa00">F</text>
    <text x="0" y="200" text-anchor="middle" font-size="14">MA = 2:1</text>
  </g>
  
  <!-- Complex MA System (3:1) -->
  <g transform="translate(450, 100)">
    <text x="0" y="-10" font-size="16" font-weight="bold">3:1 System</text>
    <!-- Anchor -->
    <circle cx="0" cy="0" r="8" fill="#333"/>
    <!-- Rope path (simplified 3:1) -->
    <line x1="0" y1="0" x2="0" y2="100" stroke="#0066cc" stroke-width="3"/>
    <line x1="0" y1="100" x2="60" y2="100" stroke="#0066cc" stroke-width="3"/>
    <line x1="60" y1="100" x2="60" y2="50" stroke="#0066cc" stroke-width="3"/>
    <line x1="60" y1="50" x2="100" y2="50" stroke="#0066cc" stroke-width="3"/>
    <!-- Pulleys -->
    <circle cx="0" cy="100" r="12" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="60" cy="50" r="12" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Load -->
    <rect x="90" y="40" width="20" height="30" fill="#cc0000"/>
    <text x="100" y="30" text-anchor="middle" font-size="14">Load</text>
    <!-- Force arrow -->
    <path d="M 110 100 L 140 100" stroke="#00aa00" stroke-width="2" marker-end="url(#arrowgreen)"/>
    <text x="155" y="105" font-size="14" fill="#00aa00">F</text>
    <text x="50" y="150" text-anchor="middle" font-size="14">MA = 3:1</text>
  </g>
  
  <!-- Key concepts box -->
  <g transform="translate(50, 350)">
    <rect width="700" height="200" fill="white" stroke="#333" stroke-width="2" rx="5"/>
    <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold">Key Concepts</text>
    
    <text x="30" y="60" font-size="14">
      <tspan x="30" dy="0">• Mechanical Advantage (MA) = Load / Effort</tspan>
      <tspan x="30" dy="25">• Each rope segment supporting the load contributes to MA</tspan>
      <tspan x="30" dy="25">• Higher MA = less force needed to lift the load</tspan>
      <tspan x="30" dy="25">• Friction in pulleys reduces theoretical MA</tspan>
      <tspan x="30" dy="25">• Complex systems require vector analysis</tspan>
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00aa00"/>
    </marker>
  </defs>
</svg>
