<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Figure 17-2: Highline Sag and Tension -->
  <title>Highline Sag and Tension Relationships</title>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial, sans-serif">
    Figure 17-2: Highline Sag and Tension Relationships
  </text>
  
  <!-- Tight highline (minimal sag) -->
  <g transform="translate(100, 150)">
    <text x="250" y="-20" font-size="16" font-weight="bold" text-anchor="middle">Tight Highline (High Tension)</text>
    <!-- Anchors -->
    <circle cx="0" cy="0" r="8" fill="#333"/>
    <circle cx="500" cy="0" r="8" fill="#333"/>
    <!-- Highline with minimal sag -->
    <path d="M 0 0 Q 250 20 500 0" fill="none" stroke="#0066cc" stroke-width="3"/>
    <!-- Load -->
    <rect x="240" y="15" width="20" height="30" fill="#cc0000"/>
    <text x="250" y="65" text-anchor="middle" font-size="14" fill="#cc0000">High Tension</text>
    <text x="250" y="85" text-anchor="middle" font-size="14">Small deviation angle</text>
  </g>
  
  <!-- Loose highline (more sag) -->
  <g transform="translate(100, 350)">
    <text x="250" y="-20" font-size="16" font-weight="bold" text-anchor="middle">Loose Highline (Lower Tension)</text>
    <!-- Anchors -->
    <circle cx="0" cy="0" r="8" fill="#333"/>
    <circle cx="500" cy="0" r="8" fill="#333"/>
    <!-- Highline with more sag -->
    <path d="M 0 0 Q 250 80 500 0" fill="none" stroke="#0066cc" stroke-width="3"/>
    <!-- Load -->
    <rect x="240" y="75" width="20" height="30" fill="#cc0000"/>
    <text x="250" y="125" text-anchor="middle" font-size="14" fill="#00aa00">Lower Tension</text>
    <text x="250" y="145" text-anchor="middle" font-size="14">Larger deviation angle</text>
  </g>
  
  <!-- Key relationship box -->
  <g transform="translate(50, 480)">
    <rect width="700" height="100" fill="white" stroke="#333" stroke-width="2" rx="5"/>
    <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold">Key Relationship</text>
    
    <text x="30" y="50" font-size="14">
      <tspan x="30" dy="0">• Less sag = smaller deviation angle = higher tension in line</tspan>
      <tspan x="30" dy="20">• More sag = larger deviation angle = lower tension but higher anchor forces</tspan>
      <tspan x="30" dy="20">• Balance between line tension and anchor capacity is critical</tspan>
    </text>
  </g>
</svg>
