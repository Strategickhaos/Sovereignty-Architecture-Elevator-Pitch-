# RTL-SDR Configuration for INV-086
# Spectrum Scanning Settings

[device]
# RTL-SDR device index (0 for first device)
device_index = 0

# Sample rate (in Hz)
# Common values: 2400000 (2.4 MSPS), 1024000, 2048000
sample_rate = 2400000

# Tuner gain (in dB)
# Range: 0-50 (0 = automatic gain control)
# Recommended: 40-50 for most scenarios
gain = 45

# Frequency correction (PPM)
# Adjust if your dongle has frequency drift
# Range: -100 to 100
freq_correction = 0

[scanning]
# Frequency range for automated scanning
# Format: start_freq:end_freq:step (in Hz)
freq_range_1 = 100M:1700M:1M
freq_range_2 = 400M:512M:100k

# Scan integration time
# How long to integrate signal before moving to next frequency
# Format: seconds or minutes (e.g., 10s, 1m, 10m)
integration_time = 10m

# Output directory for scan results
output_dir = /tmp/spectrum_scans

[frequencies]
# Predefined frequencies of interest (in MHz)
# Format: name = frequency
fm_radio = 88-108
weather_radio = 162.400, 162.425, 162.450, 162.475, 162.500, 162.525, 162.550
public_safety = 453-454, 458-459
ism_433 = 433.920
ism_915 = 915.000
wifi_24g = 2412-2472
wifi_5g = 5180-5825

[visualization]
# Enable real-time waterfall display
enable_waterfall = true

# Waterfall color map
# Options: viridis, plasma, inferno, magma, jet, hot
colormap = viridis

# Save plots automatically
auto_save_plots = true
plot_format = png
plot_dpi = 150

[logging]
# Enable detailed logging
enable_logging = true
log_level = INFO
log_file = /var/log/rf_harvest/sdr.log

[alerts]
# Enable alerts for strong signals
enable_alerts = false
alert_threshold = -50  # dBm
alert_command = /usr/local/bin/rf_alert.sh
