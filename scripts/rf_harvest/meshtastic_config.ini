# Meshtastic LoRa Mesh Network Configuration
# INV-086 RF Sovereignty Project

# ========================================
# NODE CONFIGURATION
# ========================================

[device]
# Node name/identifier (unique per node)
node_name = Athena-Node-1

# Device role
# Options: CLIENT, ROUTER, REPEATER
role = CLIENT

# ========================================
# LORA RADIO SETTINGS
# ========================================

[lora]
# Region (REQUIRED for legal operation)
# Options: US, EU_868, EU_433, CN, JP, ANZ, KR, TW, RU, IN, NZ_865, TH, UA_868, MY_919, SG_923
region = US

# Modem preset
# Options: LONG_FAST, LONG_SLOW, MEDIUM_FAST, MEDIUM_SLOW, SHORT_FAST, SHORT_SLOW
# LONG_SLOW = maximum range (~20km), slow speed
# LONG_FAST = good range (~10km), better speed
modem_preset = LONG_FAST

# Transmit power (in dBm)
# Range: 0-30 (max 30 dBm = 1W for US)
tx_power = 30

# Hop limit (max number of hops for message relay)
# Range: 1-7 (3 is good default)
hop_limit = 3

# ========================================
# MESH NETWORK SETTINGS
# ========================================

[network]
# WiFi settings (for gateway nodes with internet access)
wifi_enabled = false
wifi_ssid = 
wifi_password = 

# MQTT settings (for bridging to internet services)
mqtt_enabled = false
mqtt_server = 
mqtt_username = 
mqtt_password = 

# ========================================
# CHANNEL CONFIGURATION
# ========================================

[channel]
# Primary channel name
name = SovereignMesh

# Channel key (PSK - Pre-Shared Key)
# Options: 
#   - "random" = generate random key
#   - "default" = use default key (not secure)
#   - "base64_encoded_key" = custom key
psk = random

# Secondary channels (optional)
# Format: name|psk|uplink_enabled|downlink_enabled
# channel_2 = SecondaryChannel|random|true|true

# ========================================
# POSITION SETTINGS
# ========================================

[position]
# GPS broadcast interval (seconds)
# 0 = disable position broadcasts
position_broadcast_interval = 900  # 15 minutes

# Fixed position (if no GPS available)
# Format: latitude,longitude,altitude
# fixed_position = 40.7128,-74.0060,10

# ========================================
# POWER MANAGEMENT
# ========================================

[power]
# Power saving mode
# Options: POWER_SAVING, FULL_POWER
power_mode = FULL_POWER

# Screen timeout (seconds)
# 0 = always on
screen_timeout = 60

# Light sleep enabled (saves power when idle)
light_sleep_enabled = true

# ========================================
# TELEMETRY
# ========================================

[telemetry]
# Device metrics interval (seconds)
device_update_interval = 900  # 15 minutes

# Environment metrics (if sensors available)
environment_update_interval = 900  # 15 minutes

# ========================================
# SECURITY
# ========================================

[security]
# Admin channel enabled
admin_channel_enabled = true

# Serial console enabled
serial_enabled = true

# Bluetooth enabled (for mobile app pairing)
bluetooth_enabled = true

# ========================================
# EXAMPLE CONFIGURATIONS
# ========================================

# GATEWAY NODE (Internet bridge):
# [network]
# wifi_enabled = true
# wifi_ssid = PhoneHotspot
# wifi_password = password123
# mqtt_enabled = true
# mqtt_server = mqtt.meshtastic.org

# REPEATER NODE (High-gain, elevated):
# [device]
# role = REPEATER
# [lora]
# tx_power = 30
# hop_limit = 7
# [power]
# light_sleep_enabled = false

# PORTABLE NODE (Battery conservation):
# [lora]
# modem_preset = LONG_SLOW
# tx_power = 20
# [power]
# power_mode = POWER_SAVING
# light_sleep_enabled = true
# [position]
# position_broadcast_interval = 1800  # 30 minutes
