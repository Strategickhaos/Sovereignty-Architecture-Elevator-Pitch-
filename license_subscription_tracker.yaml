# === KhaosBase Schema Definition ===
khaosbase_schema:
  table_name: "license_tracker"
  description: "Centralized tracking for all software licenses and subscriptions"
  
  fields:
    - name: "product_name"
      type: "text"
      required: true
      description: "Name of the software product or service"
    
    - name: "vendor"
      type: "text"
      required: true
      description: "Company or organization providing the license"
    
    - name: "license_type"
      type: "select"
      required: true
      options: ["Educational", "Trial", "Paid", "Open Source", "Freemium"]
      description: "Type of license agreement"
    
    - name: "status"
      type: "select"
      required: true
      options: ["Active", "Expiring Soon", "Expired", "Renewal Pending", "Migrating"]
      description: "Current status of the license"
    
    - name: "valid_from"
      type: "date"
      required: false
      description: "License start date"
    
    - name: "valid_until"
      type: "date"
      required: false
      description: "License expiration date (null for perpetual)"
    
    - name: "days_remaining"
      type: "formula"
      formula: "DATETIME_DIFF({valid_until}, TODAY(), 'days')"
      description: "Calculated days until expiration"
    
    - name: "cost_annual"
      type: "currency"
      required: false
      description: "Annual cost in USD (0 for free/educational)"
    
    - name: "billing_entity"
      type: "select"
      required: true
      options: ["SSSF LLC", "ValorYield DAO", "StrategicKhaos DAO", "Personal"]
      description: "Which entity is responsible for payment"
    
    - name: "tax_deductible"
      type: "checkbox"
      required: true
      description: "Whether cost is tax-deductible as business expense"
    
    - name: "commercial_use_allowed"
      type: "checkbox"
      required: true
      description: "Educational licenses must remain non-commercial"
    
    - name: "migration_target"
      type: "text"
      required: false
      description: "Target system if migration is planned (e.g., 'KhaosBase', 'KhaosFlow')"
    
    - name: "migration_status"
      type: "select"
      required: false
      options: ["Not Started", "Planning", "In Progress", "Testing", "Complete"]
      description: "Status of migration effort"
    
    - name: "account_owner"
      type: "text"
      required: true
      description: "Email or username of account holder"
    
    - name: "seat_count"
      type: "number"
      required: false
      description: "Number of licensed seats/users"
    
    - name: "notes"
      type: "long text"
      required: false
      description: "Additional notes, restrictions, or special terms"
    
    - name: "last_reviewed"
      type: "date"
      required: false
      description: "Date of last license audit/review"
    
    - name: "auto_renewal"
      type: "checkbox"
      required: false
      description: "Whether license auto-renews"

  views:
    - name: "Expiring Soon"
      filter: "AND({status} = 'Active', {days_remaining} <= 30)"
      sort: [{field: "days_remaining", direction: "asc"}]
      description: "Licenses expiring in the next 30 days"
    
    - name: "Educational Licenses"
      filter: "{license_type} = 'Educational'"
      description: "All educational licenses requiring compliance monitoring"
    
    - name: "Commercial Allowed"
      filter: "{commercial_use_allowed} = true"
      description: "Licenses approved for commercial/client work"
    
    - name: "SSSF LLC Expenses"
      filter: "{billing_entity} = 'SSSF LLC'"
      sort: [{field: "cost_annual", direction: "desc"}]
      description: "All licenses billed to SSSF LLC for financial reporting"
    
    - name: "Migration Pipeline"
      filter: "{migration_status} != 'Not Started'"
      description: "Active migration efforts to track"

  automations:
    - name: "Alert 14 Days Before Expiry"
      trigger: "{days_remaining} = 14"
      action: "Send notification to #licenses channel"
      message: "⚠️ License expiring in 14 days: {product_name} ({vendor})"
    
    - name: "Alert 7 Days Before Expiry"
      trigger: "{days_remaining} = 7"
      action: "Send notification to #licenses channel"
      message: "🚨 URGENT: License expiring in 7 days: {product_name} ({vendor})"
    
    - name: "Mark as Expired"
      trigger: "{days_remaining} < 0"
      action: "Update status to 'Expired'"
    
    - name: "Educational Compliance Check"
      trigger: "Record created or updated"
      condition: "AND({license_type} = 'Educational', {commercial_use_allowed} = true)"
      action: "Flag for review"
      message: "⚠️ Educational license marked for commercial use: {product_name}"

