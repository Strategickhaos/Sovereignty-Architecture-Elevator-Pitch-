# === Compliance Notes ===
compliance:
  educational_license_policy: |
    JetBrains educational licenses (PhpStorm, dotMemory, etc.) obtained through
    SNHU account (domenic.garza@snhu.edu) must be used exclusively for:
    - Coursework and academic projects
    - Personal learning and skill development
    - Non-commercial research and development
    
    These licenses MUST NOT be used for:
    - Paid client work
    - Commercial software development
    - Work billed through SSSF LLC
    
    When SSSF LLC begins billing clients, a separate JetBrains All Products Pack
    commercial license must be purchased under SSSF LLC entity with commercial_use_allowed: true.
  
  migration_strategy: |
    Trial services should be evaluated for migration to sovereign alternatives:
    - Airtable → KhaosBase (database/project management)
    - Zapier → KhaosFlow (automation workflows)
    - GitHub Enterprise → Self-hosted GitLab or maintain GitHub Team plan
    
    Migration timeline: Q1 2026 for KhaosBase, Q2 2026 for KhaosFlow

  audit_schedule: |
    License audit should be conducted:
    - Monthly: Review expiring licenses and renewal decisions
    - Quarterly: Full compliance review of educational licenses
    - Annually: Cost optimization and vendor consolidation analysis
    - As needed: When adding new team members or starting client work

