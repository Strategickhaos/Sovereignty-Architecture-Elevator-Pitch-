          channels: [4, 16, 256]
          sampling_rates: ["128Hz", "256Hz", "1000Hz"]
          preprocessing: "MNE-Python"
          
      - id: "BS-ARTIFACT"
        name: "Artifact Removal Gene"
        sequence: "ATGC-ICA-DENOISE-FILTER-GCAT"
        expression:
          methods: ["ICA", "bandpass", "notch"]
          frequency_range: "0.5-50 Hz"
          
      - id: "BS-PATTERN"
        name: "Pattern Recognition Gene"
        sequence: "TACG-ADHD-AUTISM-EPILEPSY-CGTA"
        expression:
          targets: ["ADHD", "Autism", "Epilepsy"]
          biomarkers: ["burst", "entropy", "spike-wave", "HFO"]
          
  CHROMOSOME_GENETIC:
    locus: "NEURO-00-03"
