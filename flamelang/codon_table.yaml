# ═══════════════════════════════════════════════════════════════════════════
# CODON STRUCTURE
# ═══════════════════════════════════════════════════════════════════════════
# Each codon consists of:
#   - glyph_pattern: EEG/neural feature pattern that triggers codon
#   - codon: Symbolic name for the operation
#   - operation: Cognitive augmentation action
#   - genomic_link: Associated genetic marker/variant
#   - priority: Execution priority (1=highest, 10=lowest)
#   - power_cost: Estimated power consumption in mW
#   - latency: Expected execution latency in ms
# ═══════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════
# NEUROLOGICAL CODONS
# ═══════════════════════════════════════════════════════════════════════════
neurological_codons:
  
  # ─────────────────────────────────────────────────────────────────────────
  # EPILEPSY / SEIZURE CODONS
  # ─────────────────────────────────────────────────────────────────────────
  - glyph_pattern: "epilepsy_spike"
    codon: "SEIZURE_PREDICT"
    operation: "Pre-alert system activation"
    description: "Detect seizure precursors and alert user 30 seconds in advance"
    
    genomic_link:
      gene: "SCN1A"
      variant: "Loss-of-function mutations"
      condition: "Dravet syndrome, focal epilepsy"
      prevalence: "1 in 20,000-40,000"
      
    trigger_conditions:
      eeg_pattern: "Spike-wave complex (3-4 Hz)"
      amplitude_threshold: ">200 μV"
      duration: ">3 seconds"
      confidence: ">0.90"
      
    actions:
      - type: "ALERT"
        target: "user_interface"
        message: "⚠️ Seizure predicted in 30 seconds. Find safe position."
        modality: ["visual", "audio", "haptic"]
        
      - type: "LOG"
        target: "medical_record"
        fields: ["timestamp", "eeg_data", "prediction_confidence"]
        
      - type: "NOTIFY"
        target: "emergency_contact"
        condition: "user_opt_in"
        
    priority: 1
    power_cost: 0.5  # mW
    latency: 5  # ms
    
  - glyph_pattern: "high_frequency_oscillation"
    codon: "HFO_DETECT"
    operation: "Epilepsy biomarker identification"
    description: "Real-time detection of high-frequency oscillations (80-500 Hz)"
    
    genomic_link:
      gene: "KCNQ2"
      variant: "Missense mutations"
      condition: "Benign familial neonatal seizures"
      
    trigger_conditions:
      frequency_range: "80-500 Hz"
      duration: ">10 ms"
      confidence: ">0.85"
      
    actions:
      - type: "BIOMARKER_LOG"
        target: "research_database"
        fields: ["frequency_peak", "duration", "location"]
        
    priority: 2
    power_cost: 0.3
    latency: 3
    
  # ─────────────────────────────────────────────────────────────────────────
  # ADHD CODONS
  # ─────────────────────────────────────────────────────────────────────────
  - glyph_pattern: "adhd_burst"
    codon: "FOCUS_BOOST"
    operation: "Task pipeline optimization"
    description: "Enhance focus by adjusting dopamine simulation and task chunking"
    
    genomic_link:
      gene: "DRD4"
      variant: "7-repeat allele (DRD4-7R)"
      condition: "ADHD susceptibility, novelty seeking"
      prevalence: "~20% population"
      
    trigger_conditions:
      theta_beta_ratio: ">3.0"
      burst_frequency: ">10 bursts/minute"
      task_context: "requires_sustained_attention"
      
    actions:
      - type: "AUGMENT"
        target: "cognitive_state"
        parameters:
          dopamine_boost: 1.2
          task_chunking: "enable"
          distraction_filter: "aggressive"
          
      - type: "RECOMMEND"
        target: "user_interface"
        suggestions:
          - "Take 5-minute break"
          - "Switch to kinesthetic task"
          - "Activate Pomodoro timer"
          
    priority: 3
    power_cost: 1.0
    latency: 8
    
  - glyph_pattern: "attention_drift"
    codon: "STABILIZE_LOOP"
    operation: "Feedback trigger for attention re-engagement"
    description: "Detect attentional drift and re-engage focus loop"
    
    genomic_link:
      gene: "COMT"
      variant: "Val158Met polymorphism (rs4680)"
      condition: "Dopamine regulation, executive function"
      
    trigger_conditions:
      drift_score: ">0.7"
      time_on_task: ">15 minutes"
      performance_drop: ">20%"
      
    actions:
      - type: "FEEDBACK"
        target: "attention_system"
        parameters:
          alert_level: "gentle"
          refocus_cue: "enable"
          
      - type: "ADJUST"
        target: "environment"
        parameters:
          reduce_notifications: true
          increase_contrast: true
          
    priority: 4
    power_cost: 0.7
    latency: 10
    
  # ─────────────────────────────────────────────────────────────────────────
  # AUTISM CODONS
  # ─────────────────────────────────────────────────────────────────────────
  - glyph_pattern: "autism_entropy"
    codon: "SENSORY_GATE"
    operation: "Input throttle activation"
    description: "Reduce sensory input complexity during overload"
    
    genomic_link:
      gene: "SHANK3"
      variant: "Deletions/mutations (22q13 deletion)"
      condition: "Phelan-McDermid syndrome, autism spectrum"
      prevalence: "1-2% of autism cases"
      
    trigger_conditions:
      entropy_score: ">0.85"
      sensory_channels: ">5 simultaneous"
      arousal_level: "elevated"
      
    actions:
      - type: "THROTTLE"
        target: "sensory_input"
        parameters:
          visual_complexity: 0.5
          audio_volume: 0.6
          haptic_feedback: "disable"
          
      - type: "SIMPLIFY"
        target: "interface"
        parameters:
          color_palette: "monochrome"
          animation: "disable"
          layout: "minimal"
          
    priority: 2
    power_cost: 0.8
    latency: 6
    
  - glyph_pattern: "reduced_alpha_coherence"
    codon: "ALPHA_SYNC"
    operation: "Inter-hemispheric synchronization boost"
    description: "Enhance alpha band coherence for improved integration"
    
    genomic_link:
      gene: "MECP2"
      variant: "Loss-of-function mutations (Xq28)"
      condition: "Rett syndrome, autism features"
      
    trigger_conditions:
      alpha_coherence: "<0.4"
      frequency_band: "8-12 Hz"
      hemisphere_asymmetry: ">0.3"
      
    actions:
      - type: "STIMULATE"
        target: "neural_oscillation"
        parameters:
          target_frequency: "10 Hz"
          modulation: "binaural_beats"
          
    priority: 5
    power_cost: 1.2
    latency: 15
    
  # ─────────────────────────────────────────────────────────────────────────
  # MEMORY CODONS
  # ─────────────────────────────────────────────────────────────────────────
  - glyph_pattern: "memory_gap"
    codon: "MEMORY_EXPORT"
    operation: "External memory logging"
    description: "Detect working memory gaps and export context to persistent storage"
    
    genomic_link:
      gene: "APOE"
      variant: "ε4 allele (rs429358, rs7412)"
      condition: "Alzheimer's disease risk, memory decline"
      prevalence: "~25% carry one ε4 allele"
      
    trigger_conditions:
      working_memory_load: ">0.9"
      recall_failure: ">2 within 5 minutes"
      context_complexity: "high"
      
    actions:
      - type: "EXPORT"
        target: "external_memory"
        parameters:
          format: "structured_note"
          fields: ["timestamp", "context", "key_items"]
          storage: "obsidian_vault"
          
      - type: "REMIND"
        target: "user_interface"
        parameters:
          timing: "context_relevant"
          method: "push_notification"
          
    priority: 3
    power_cost: 0.4
    latency: 12
    
  - glyph_pattern: "theta_phase_reset"
    codon: "MEMORY_ENCODE"
    operation: "Enhance memory encoding"
    description: "Optimize theta phase for memory consolidation"
    
    genomic_link:
      gene: "BDNF"
      variant: "Val66Met polymorphism (rs6265)"
      condition: "Memory performance, neuroplasticity"
      
    trigger_conditions:
      theta_power: ">0.6"
      phase_lock: ">0.5"
      learning_context: true
      
    actions:
      - type: "OPTIMIZE"
        target: "memory_encoding"
        parameters:
          theta_entrainment: "enable"
          consolidation_window: "extend"
          
    priority: 6
    power_cost: 0.9
    latency: 20
    
  # ─────────────────────────────────────────────────────────────────────────
  # EXECUTIVE FUNCTION CODONS
  # ─────────────────────────────────────────────────────────────────────────
  - glyph_pattern: "beta_suppression"
    codon: "EXECUTIVE_ENGAGE"
    operation: "Executive function enhancement"
    description: "Boost beta band power for cognitive control"
    
    genomic_link:
      gene: "SLC6A3"
      variant: "DAT1 10-repeat allele (VNTR)"
      condition: "Dopamine transporter function, ADHD"
      
    trigger_conditions:
      beta_power: "<0.4"
      task_demand: "high_cognitive_control"
      error_rate: ">15%"
      
    actions:
      - type: "ENHANCE"
        target: "executive_function"
        parameters:
          beta_boost: 1.3
          inhibitory_control: "strengthen"
          
    priority: 4
    power_cost: 1.1
    latency: 10
    
  # ─────────────────────────────────────────────────────────────────────────
  # SLEEP & CIRCADIAN CODONS
  # ─────────────────────────────────────────────────────────────────────────
  - glyph_pattern: "delta_wave_dominance"
    codon: "SLEEP_STAGE_DETECT"
    operation: "Sleep stage identification"
    description: "Detect deep sleep stages for optimization"
    
    genomic_link:
      gene: "PER3"
      variant: "VNTR polymorphism (4-repeat vs 5-repeat)"
      condition: "Circadian preference, sleep timing"
      
    trigger_conditions:
      delta_power: ">0.7"
      frequency_range: "0.5-4 Hz"
      time_of_day: "night"
      
    actions:
      - type: "LOG"
        target: "sleep_database"
        fields: ["stage", "duration", "quality_score"]
        
      - type: "OPTIMIZE"
        target: "sleep_environment"
        parameters:
          temperature: "cool"
          light: "minimal"
          sound: "white_noise"
          
    priority: 7
    power_cost: 0.3
    latency: 5

# ═══════════════════════════════════════════════════════════════════════════
# SYSTEM CODONS
# ═══════════════════════════════════════════════════════════════════════════
system_codons:
  
  - glyph_pattern: "power_critical"
    codon: "POWER_SAVE"
    operation: "Energy conservation mode"
    description: "Reduce processing to essential functions only"
    
    trigger_conditions:
      battery_level: "<10%"
      power_consumption: ">2W"
      
    actions:
      - type: "REDUCE"
        target: "processing_load"
        parameters:
          sampling_rate: 0.5
          feature_extraction: "minimal"
          
    priority: 1
    power_cost: 0.1
    latency: 2
    
  - glyph_pattern: "data_quality_degraded"
    codon: "SIGNAL_QUALITY_CHECK"
    operation: "Data quality monitoring"
    description: "Detect and compensate for poor signal quality"
    
    trigger_conditions:
      snr: "<5 dB"
      artifact_ratio: ">0.3"
      
    actions:
      - type: "ALERT"
        target: "user"
        message: "📡 Check sensor contact quality"
        
      - type: "COMPENSATE"
        target: "preprocessing"
        parameters:
          filtering: "aggressive"
          interpolation: "enable"
          
    priority: 2
    power_cost: 0.6
    latency: 8

# ═══════════════════════════════════════════════════════════════════════════
# CODON INTERACTION RULES
# ═══════════════════════════════════════════════════════════════════════════
interaction_rules:
  
  mutual_exclusion:
    - codons: ["FOCUS_BOOST", "ALPHA_SYNC"]
      reason: "Conflicting frequency band targets"
      
    - codons: ["POWER_SAVE", "EXECUTIVE_ENGAGE"]
      reason: "Resource conflict"
      
  synergistic_pairs:
    - codons: ["SENSORY_GATE", "STABILIZE_LOOP"]
      effect: "Enhanced calming response"
      boost: 1.2
      
    - codons: ["MEMORY_EXPORT", "MEMORY_ENCODE"]
      effect: "Improved memory consolidation"
      boost: 1.15
      
  sequential_dependencies:
    - prerequisite: "SIGNAL_QUALITY_CHECK"
      dependent: ["SEIZURE_PREDICT", "HFO_DETECT"]
      reason: "Accurate detection requires clean signal"

# ═══════════════════════════════════════════════════════════════════════════
# FLAMELANG COMPILATION MAPPING
# ═══════════════════════════════════════════════════════════════════════════
flamelang_compilation:
  
  bytecode_generation:
    template: |
      CODON {codon_name}
        TRIGGER: {trigger_conditions}
        EXECUTE: {actions}
        PRIORITY: {priority}
        POWER: {power_cost}mW
        LATENCY: {latency}ms
      END
      
  runtime_integration:
    os: "SAGCO-OS"
    module: "cognitive_augmentation.so"
    scheduler: "priority_based"
    power_manager: "dynamic_voltage_scaling"
    
  deployment:
    format: "sagco_module.flame"
    loader: "sagco_kernel_loader"
    execution: "event_driven"

