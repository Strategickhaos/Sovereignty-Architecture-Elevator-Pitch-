# TRIG6 Neurograph Visualization Config
# Cortical visualization of compiler evolution

neurograph_config:
  version: "1.0"
  title: "TRIG6 Cortical Compiler Evolution"
  description: "Observe the organism - Neural visualization of evolutionary fitness"

# Visual mapping of evolutionary metrics
metrics_visualization:
  equivalence:
    display_name: "Equivalence (eq)"
    color: "#00ff00"
    threshold_warning: 0.99
    threshold_critical: 1.0
    neuron_layer: "cortex_layer_1"

  noise:
    display_name: "Noise/Entropy (h)"
    color: "#ff6600"
    threshold_warning: 0.15
    threshold_critical: 0.25
    neuron_layer: "cortex_layer_2"

  drift:
    display_name: "Behavioral Drift (d)"
    color: "#ff0066"
    threshold_warning: 0.25
    threshold_critical: 0.35
    neuron_layer: "cortex_layer_3"

  coherence:
    display_name: "Coherence (anti-brittleness)"
    color: "#0066ff"
    threshold_warning: 0.80
    threshold_critical: 0.70
    neuron_layer: "cortex_layer_4"

  resilience:
    display_name: "Resilience (r)"
    color: "#00ffff"
    threshold_warning: 0.5
    threshold_critical: 0.3
    neuron_layer: "cortex_layer_5"

  innovation:
    display_name: "Innovation (i)"
    color: "#ff00ff"
    threshold_warning: 0.3
    threshold_critical: 0.5
    neuron_layer: "cortex_layer_6"

# Fitness function visualization
fitness_equation:
  formula: "f = r(1-d)(1-h)·i·eq + ρp + γb"
  components:
    core: "r(1-d)(1-h)·i·eq"
    performance: "ρp"
    bias_correction: "γb"
  
  weights:
    rho: 0.3   # ρ - performance weight
    gamma: 0.1 # γ - bias correction weight

# Visualization layers
cortex_layers:
  - id: "cortex_layer_1"
    name: "Correctness Cortex"
    metrics: ["equivalence"]
    visualization: "line_graph"

  - id: "cortex_layer_2"
    name: "Entropy Cortex"
    metrics: ["noise"]
    visualization: "heat_map"

  - id: "cortex_layer_3"
    name: "Variance Cortex"
    metrics: ["drift"]
    visualization: "scatter_plot"

  - id: "cortex_layer_4"
    name: "Stability Cortex"
    metrics: ["coherence"]
    visualization: "line_graph"

  - id: "cortex_layer_5"
    name: "Recovery Cortex"
    metrics: ["resilience"]
    visualization: "bar_chart"

  - id: "cortex_layer_6"
    name: "Innovation Cortex"
    metrics: ["innovation"]
    visualization: "bubble_chart"

# DNA strand visualization
dna_strand:
  current: "TRIG6-WAVE1-HYBRID1-NEURO1-LABCONV1-EVOGATE1"
  codons:
    - name: "TRIG6"
      description: "Trigonometric metrics foundation"
      color: "#ff0000"
    - name: "WAVE1"
      description: "Wave function analysis"
      color: "#ff7700"
    - name: "HYBRID1"
      description: "Hybrid execution model"
      color: "#ffff00"
    - name: "NEURO1"
      description: "Neural network integration"
      color: "#00ff00"
    - name: "LABCONV1"
      description: "Lab converter genome"
      color: "#0077ff"
    - name: "EVOGATE1"
      description: "Evolutionary gate selector"
      color: "#7700ff"

# Real-time monitoring
monitoring:
  update_interval_ms: 1000
  history_length: 100
  alert_on_regression: true
  
  alerts:
    fitness_drop_threshold: 0.05  # Alert if fitness drops >5%
    hard_gate_failure: true       # Alert on hard gate failures
    
  export:
    format: "json"
    path: "./evolution_history.json"

# Chart configuration
charts:
  fitness_over_time:
    type: "line"
    x_axis: "generation"
    y_axis: "fitness"
    title: "Evolutionary Fitness Over Time"
    
  metric_radar:
    type: "radar"
    metrics: ["equivalence", "noise", "drift", "coherence", "resilience", "innovation"]
    title: "Multi-dimensional Fitness Radar"
    
  dna_timeline:
    type: "timeline"
    x_axis: "timestamp"
    y_axis: "codon"
    title: "DNA Strand Evolution Timeline"
