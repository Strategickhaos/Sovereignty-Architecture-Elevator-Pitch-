# Component definitions for reference

trig6_components:
  theta:
    description: "Phase angle - progress/phase in dynamical systems"
    range: [0, 2π]
    math_mapping: "Bifurcation triggers, stability angles"
    
  R:
    description: "Resonance - consistency/coverage/stability"
    range: [0, 1]
    math_mapping: "Stochastic resonance, coherence measures"
    
  D:
    description: "Drift - reassignment/outliers"
    range: [0, 1]
    math_mapping: "Parameter drift, genetic drift in populations"
    
  N:
    description: "Noise - variance/entropy"
    range: [0, 1]
    math_mapping: "Intrinsic/extrinsic noise, bursting dynamics"
    
  eq:
    description: "Equivalence - closeness to target"
    range: [0, 1]
    math_mapping: "Information geometry distances (KL-divergence)"
    
  danger:
    description: "Instability indicator"
    formula: "|tan(theta)| > limit or variance_rate > 0.1"
    math_mapping: "Bifurcation points, instability poles"
    
  fitness:
    description: "Overall system fitness"
    formula: "R * (1 - D) * (1 - N) * eq"
    math_mapping: "Fitness landscapes, bet-hedging strategies"

