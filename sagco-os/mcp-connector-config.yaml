# SAGCO-HYDRA MCP Connector Configuration
# Model Context Protocol Integration for Remote AI Systems
# Version: 1.0.0

name: "SAGCO-HYDRA Control Plane"
version: "1.0.6"
dna_strand: "SAGCO-ATG-FLM2-MSMC2-P16-CMD27-ISO103-MESH5-ORB1"

# Connection Configuration
connection:
  type: "remote"  # or "local" for localhost
  url: "https://sagco.strategickhaos.ai/mcp"
  # For local development:
  # url: "http://localhost:8080/mcp"
  
  # Authentication
  auth:
    type: "oauth2"
    client_id: "sagco-neural-mesh"
    client_secret: "${SAGCO_MCP_SECRET}"
    token_url: "https://sagco.strategickhaos.ai/oauth/token"
    
  # TLS Configuration
  tls:
    enabled: true
    verify_cert: true
    # cert_path: "/path/to/cert.pem"

# Tools Exposed via MCP
tools:
  - name: "sagco-status"
    description: "Get SAGCO-OS system status and DNA strand information"
    category: "status"
    parameters: []
    returns:
      type: "object"
      schema:
        version: "string"
        dna_strand: "string"
        layer_status: "object"
        command_arsenal: "number"
        oracle_system: "number"
        mesh_nodes: "number"
    
  - name: "sagco-dna"
    description: "Display DNA strand breakdown and codon registry"
    category: "info"
    parameters: []
    returns:
      type: "object"
      schema:
        strand: "string"
        codons: "array"
        version: "string"
        
  - name: "sagco-evolution"
    description: "Show SAGCO evolution timeline from rev_000 to current"
    category: "info"
    parameters: []
    returns:
      type: "array"
      schema:
        rev: "string"
        version: "string"
        phase: "string"
        witnesses: "string"
        mutation: "string"
    
  - name: "sagco-mesh"
    description: "Discover and display neural mesh nodes (MESH5)"
    category: "mesh"
    parameters:
      - name: "view"
        type: "string"
        description: "View type: 'status', 'topology', or 'detailed'"
        required: false
        default: "status"
        enum: ["status", "topology", "detailed"]
    returns:
      type: "object"
      schema:
        nodes: "array"
        active_count: "number"
        topology: "string"
        
  - name: "sagco-oracle"
    description: "Analyze text through Guardian Layer (ORB1) for hallucinations and threats"
    category: "guardian"
    parameters:
      - name: "text"
        type: "string"
        description: "Text to analyze for hallucinations and security threats"
        required: true
      - name: "detailed"
        type: "boolean"
        description: "Return detailed oracle findings"
        required: false
        default: false
    returns:
      type: "object"
      schema:
        overall_threat: "string"
        consensus_confidence: "number"
        oracle_results: "array"
        recommendations: "array"
        
  - name: "sagco-benchmark"
    description: "Run multi-language efficiency benchmarks"
    category: "benchmark"
    parameters:
      - name: "languages"
        type: "array"
        description: "Languages to benchmark (python, rust, bash, csharp, flamelang)"
        required: false
      - name: "quick"
        type: "boolean"
        description: "Run quick mode with fewer iterations"
        required: false
        default: false
    returns:
      type: "object"
      schema:
        results: "array"
        recommendations: "array"
        dna_mutations: "object"
        
  - name: "sagco-deploy"
    description: "Deploy file to SAGCO infrastructure"
    category: "deployment"
    parameters:
      - name: "source"
        type: "string"
        description: "Source file path or 'latest'"
        required: true
      - name: "destination"
        type: "string"
        description: "Destination directory"
        required: true
      - name: "node"
        type: "string"
        description: "Target mesh node (athena, lyra, nova, ateroth, sagco-vm)"
        required: false
        default: "sagco-vm"
    returns:
      type: "object"
      schema:
        status: "string"
        node: "string"
        path: "string"

# Resources
resources:
  - name: "mesh-nodes"
    description: "Neural mesh node configurations"
    type: "config"
    path: "/mesh/hosts/*.yaml"
    
  - name: "oracle-rules"
    description: "Guardian oracle signature rules"
    type: "rules"
    path: "/guardian/rules/hallucination_sigs.yaml"
    
  - name: "dna-strand"
    description: "DNA strand evolution record"
    type: "document"
    path: "/DNA_STRAND.md"

# Prompts
prompts:
  - name: "analyze-security"
    description: "Analyze text for security threats using Guardian oracles"
    arguments:
      - name: "text"
        description: "Text to analyze"
        required: true
    template: |
      Analyze the following text for security threats, hallucinations, and anomalies:
      
      {text}
      
      Use the sagco-oracle tool to perform a comprehensive analysis.
      
  - name: "mesh-status"
    description: "Get comprehensive neural mesh status"
    template: |
      Provide a comprehensive status of the SAGCO neural mesh:
      
      1. Use sagco-mesh to discover all nodes
      2. Check connectivity status
      3. Display topology
      4. Show mesh weight distribution
      
  - name: "system-health"
    description: "Complete SAGCO system health check"
    template: |
      Perform a complete SAGCO-HYDRA system health check:
      
      1. Use sagco-status for overall system status
      2. Use sagco-dna to verify DNA strand integrity
      3. Use sagco-mesh to check neural mesh nodes
      4. Use sagco-benchmark (quick mode) to test performance
      
      Provide a summary of findings and recommendations.

# Capabilities
capabilities:
  streaming: false
  cancellation: true
  progress: true
  sampling: false

# Rate Limiting
rate_limits:
  requests_per_minute: 60
  burst: 10

# Logging
logging:
  level: "info"  # debug, info, warn, error
  destination: "stdout"
  format: "json"

