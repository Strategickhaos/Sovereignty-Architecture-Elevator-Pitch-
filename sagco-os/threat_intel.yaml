  # Action Definitions
  actions:
    BLOCK:
      enforcement: "iptables/nftables rule"
      description: "Immediately drop all traffic from this indicator"
      log_level: "critical"
      alert_guardian: true
      
    RATE_LIMIT:
      enforcement: "connection throttling"
      description: "Allow limited connections to avoid false positives on shared infrastructure"
      log_level: "warning"
      alert_guardian: true
      threshold: "10 connections per minute"
      
    BLOCK_DNS:
      enforcement: "DNS resolver blacklist"
      description: "Block DNS resolution for malicious domains"
      log_level: "critical"
      alert_guardian: true
      
    ALERT:
      enforcement: "log and monitor only"
      description: "Generate alert without blocking - requires analysis"
      log_level: "info"
      alert_guardian: true
      
    QUARANTINE:
      enforcement: "file system isolation"
      description: "Isolate files matching hash signatures"
      log_level: "critical"
      alert_guardian: true

  # Guardian Integration
  guardian_integration:
    security_noise_threshold: 0.75
    theta_adjustment:
      on_threat_hit: "+0.262"  # ~15 degrees toward security mode
      on_threat_clear: "-0.131"  # ~7.5 degrees back to normal
    resonance_impact:
      threat_detected: 0.81
      threat_blocked: 0.92
    focus_router_mode:
      high_threat: "security_edge_case"
      normal: "balanced_governance"
    
  # Logging Configuration
  logging:
    threat_events_path: "/var/sagco/logs/threats.jsonl"
    alerts_path: "/var/sagco/logs/alerts.jsonl"
    governance_path: "/var/sagco/logs/governance.jsonl"
    retention_days: 90
    
  # Legal and Compliance
  compliance:
    framework: "Harbor Compliance + Internal SOC"
    documentation: "sagco-os/policies/internal_security_policy.md"
    audit_trail: true
    incident_response_plan: "Required for all CRITICAL severity indicators"
    
  # Vendor Lock-in Prevention
  vendor_agnostic:
    philosophy: "Zero vendor lock-in - all sources and enforcement mechanisms are replaceable"
    source_flexibility: "Threat intel sources can be added, removed, or replaced without system changes"
    enforcement_flexibility: "Can use iptables, nftables, WireGuard, cloud firewall APIs, or any combination"
    compiler_sovereignty: "SAGCO-OS logic for interpretation and action remains internal and proprietary"
