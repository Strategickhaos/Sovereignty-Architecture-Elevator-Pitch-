metadata:
  name: "Sovereign Cognitive Architecture"
  version: "1.0.0"
  description: "Meta-cognitive operating system for multi-LLM consciousness layer"
  operator: "DOM_010101"
  organization: "Strategickhaos DAO LLC"
  ein: "39-2923503"
  license: "MIT with Sovereign Addendum"

architecture:
  paradigm: "zero-vendor-lock-in"
  principles:
    - "Universal LLM integration via standardized ports"
    - "Unified memory mesh for context sharing"
    - "Quadrilateral verification for truth consensus"
    - "Local-first with cloud-optional design"
    - "Full data sovereignty and exportability"
    - "Cryptographic integrity at every layer"

  layers:
    - id: 1
      name: "Quadrilateral Collapse Learning"
      components:
        - symbolic  # Logic/Code verification
        - spatial   # Visual/Diagram validation
        - narrative # Story/Explanation clarity
        - kinetic   # Action/Execution tests
      purpose: "Multi-modal truth validation"
      
    - id: 2
      name: "LLM Listening Ports"
      components:
        - claude_api
        - gpt_api
        - ollama
        - qwen_api
        - custom_llm
      purpose: "Standardized microservice endpoints"
      
    - id: 3
      name: "Unified Memory Mesh"
      components:
        - qdrant      # Vector database
        - redis       # Fast K/V cache
        - memory_api  # Unified interface
      purpose: "Shared context and consciousness"
      
    - id: 4
      name: "Sovereign Codespace"
      components:
        - opentimestamps  # Immutable proof chain
        - gpg_signing     # Cryptographic signatures
        - audit_layer     # Antifragile tracking
        - export_engine   # Data portability
      purpose: "Full sovereignty and provenance"

llm_ports:
  claude:
    port: 8001
    protocol: "HTTP/REST"
    api_base: "https://api.anthropic.com/v1"
    model_default: "claude-3-5-sonnet-20241022"
    max_tokens: 8192
    capabilities:
      - reasoning
      - code_generation
      - long_context
    health_check: "/health"
    
  gpt:
    port: 8002
    protocol: "HTTP/REST"
    api_base: "https://api.openai.com/v1"
    model_default: "gpt-4-turbo-preview"
    max_tokens: 8192
    capabilities:
      - reasoning
      - vision
      - function_calling
    health_check: "/health"
    
  ollama:
    port: 11434
    protocol: "HTTP/REST"
    api_base: "http://localhost:11434"
    models:
      - "llama3:latest"
      - "mistral:latest"
      - "codellama:latest"
      - "phi3:latest"
    capabilities:
      - local_inference
      - privacy_preserving
      - offline_capable
    health_check: "/api/tags"
    
  qwen:
    port: 8003
    protocol: "HTTP/REST"
    api_base: "https://dashscope.aliyuncs.com/api/v1"
    model_default: "qwen-max"
    capabilities:
      - multilingual
      - reasoning
      - chinese_native
    health_check: "/health"
    
  custom:
    port: 8004
    protocol: "HTTP/REST"
    api_base: "http://localhost:8004"
    description: "Extensible slot for custom models"
    capabilities:
      - user_defined
    health_check: "/health"

memory_mesh:
  api:
    port: 7000
    protocol: "HTTP/REST"
    base_url: "http://localhost:7000"
    
  vector_db:
    type: "qdrant"
    host: "localhost"
    port: 6333
    grpc_port: 6334
    
  cache:
    type: "redis"
    host: "localhost"
    port: 6379
    db: 0
    
  embedding:
    model: "BAAI/bge-small-en-v1.5"
    dimension: 384
    similarity_metric: "cosine"
    batch_size: 32
    
  collections:
    conversations:
      vectors:
        size: 384
        distance: "Cosine"
      payload_schema:
        conversation_id: "string"
        llm_provider: "string"
        timestamp: "datetime"
        messages: "array"
        metadata: "object"
        
    knowledge_base:
      vectors:
        size: 384
        distance: "Cosine"
      payload_schema:
        entity: "string"
        relationships: "array"
        source_llm: "string"
        verification_score: "float"
        
  sync_protocol:
    mode: "real-time"  # real-time | batch | on-demand
    conflict_resolution: "quadrilateral_vote"
    retention_policy: "forever"
    max_history: -1  # unlimited

quadrilateral_verification:
  enabled: true
  dimensions:
    symbolic:
      weight: 1.0
      validators:
        - llm: "claude"
          priority: 1
        - llm: "gpt"
          priority: 2
      test_type: "logical_proof"
      timeout_seconds: 30
      
    spatial:
      weight: 1.0
      validators:
        - llm: "claude"
          priority: 1
        - llm: "gpt"
          priority: 2
      test_type: "diagram_generation"
      timeout_seconds: 45
      
    narrative:
      weight: 1.0
      validators:
        - llm: "claude"
          priority: 1
        - llm: "gpt"
          priority: 2
        - llm: "ollama"
          priority: 3
      test_type: "explanation_clarity"
      timeout_seconds: 30
      
    kinetic:
      weight: 1.0
      validators:
        - executor: "code_sandbox"
          priority: 1
      test_type: "practical_execution"
      timeout_seconds: 60
      sandboxed: true
      
  consensus:
    threshold: 3  # Require 3/4 to accept
    tie_breaker: "human_review"
    audit_all_votes: true
    
  scoring:
    truth: 4        # All 4 dimensions pass
    probable: 3     # 3 dimensions pass
    uncertain: 2    # 2 dimensions pass
    reject: "0-1"   # 0-1 dimensions pass

sovereign_export:
  formats:
    - json
    - yaml
    - markdown
    - sqlite
    - parquet
    
  metadata:
    timestamp_provider: "opentimestamps"
    timestamp_standard: "RFC 3161"
    signature_algorithm: "GPG RSA 4096-bit"
    hash_algorithm: "SHA-256"
    
  provenance:
    include_conversation_id: true
    include_llm_provider: true
    include_verification_scores: true
    include_audit_trail: true
    include_git_commit: true
    
  sync:
    method: "git-based"
    branch_strategy: "per-llm-session"
    merge_strategy: "quadrilateral_consensus"
    auto_commit: true
    gpg_sign_commits: true

audit_layer:
  enabled: true
  layers:
    - name: "Real-time Operations"
      provider: "airtable"
      purpose: "Structured operational records"
      
    - name: "Version Control"
      provider: "github"
      purpose: "Git commits with GPG signatures"
      
    - name: "Immutable Proof"
      provider: "opentimestamps"
      purpose: "Bitcoin blockchain anchoring"
      
    - name: "Legal Archive"
      provider: "local_filesystem"
      purpose: "Board minutes and legal filings"
      
  log_all_operations: true
  retention: "permanent"
  export_schedule: "daily"

security:
  encryption:
    at_rest: true
    in_transit: true
    algorithm: "AES-256-GCM"
    
  authentication:
    api_keys: true
    jwt_tokens: true
    mutual_tls: false  # Optional for production
    
  signing:
    gpg_key_id: null  # Configure with your key
    opentimestamps_enabled: true
    
  network:
    allowed_origins:
      - "http://localhost"
      - "http://127.0.0.1"
      - "https://localhost"
    rate_limiting:
      enabled: true
      requests_per_minute: 100

deployment:
  method: "docker-compose"
  alternative_methods:
    - "kubernetes"
    - "systemd"
    - "bare-metal"
    
  resource_requirements:
    cpu_cores: 8
    memory_gb: 32
    storage_gb: 500
    network_mbps: 100
    
  health_checks:
    enabled: true
    interval_seconds: 30
    timeout_seconds: 10
    retries: 3
    
  monitoring:
    prometheus: true
    grafana: true
    alertmanager: true
    
  logging:
    level: "INFO"  # DEBUG | INFO | WARNING | ERROR
    format: "json"
    destination: "stdout"
    retention_days: 90

