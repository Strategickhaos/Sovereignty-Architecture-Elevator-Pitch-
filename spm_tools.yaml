# SPM (System/Tools Package Manager) Configuration
# Used by sagco-menu.py for tool discovery and navigation
version: "1.2"
name: "SAGCO Tools & Systems"
description: "Sovereignty Architecture Tool Ecosystem"

categories:
  - name: "Recon & Intelligence"
    icon: "🔍"
    items:
      - name: "jetbrains_deep_recon"
        command: "./jetbrains_deep_recon.sh"
        description: "Deep reconnaissance of JetBrains ecosystem"
      - name: "launch_recon"
        command: "./launch-recon.sh"
        description: "Launch comprehensive recon suite"
      - name: "cyber_sources"
        command: "./collect_cyber_sources.sh"
        description: "Collect cyber intelligence sources"
      
  - name: "Deployment & Orchestration"
    icon: "🚀"
    items:
      - name: "deploy_empire"
        command: "./deploy-empire.sh"
        description: "Deploy full empire infrastructure"
      - name: "deploy_legion"
        command: "./deploy_legion.sh"
        description: "Deploy legion orchestration system"
      - name: "deploy_refinory"
        command: "./deploy-refinory.sh"
        description: "Deploy refinory processing engine"
      - name: "quick_deploy"
        command: "./quick-deploy.sh"
        description: "Quick deployment for testing"

  - name: "Security & Defense"
    icon: "🛡️"
    items:
      - name: "antibody_system"
        command: "python antibody_system.py"
        description: "Run antibody defense system"
      - name: "network_monitor"
        command: "python network_sovereignty_monitor.py"
        description: "Monitor network sovereignty"
      - name: "windows_defender"
        command: "python windows_defender_antibody.py"
        description: "Windows Defender antibody integration"
      - name: "break_o1"
        command: "./break_o1_mitigation.sh"
        description: "O1 mitigation breaking analysis"

  - name: "AI & Analysis"
    icon: "🤖"
    items:
      - name: "eval_redteam"
        command: "python eval_redteam.py"
        description: "Red team evaluation"
      - name: "interpretability"
        command: "python interpretability_monitor.py"
        description: "AI interpretability monitoring"
      - name: "snhu_analyzer"
        command: "python snhu_auth_analyzer.py"
        description: "SNHU authentication analysis"
      - name: "ps5_neural"
        command: "python ps5_neural_mapper.py"
        description: "PS5 neural mapping"

  - name: "Communication & Integration"
    icon: "💬"
    items:
      - name: "comms_orchestrator"
        command: "python comms_orchestrator.py"
        description: "Communications orchestration"
      - name: "obsidian_bot"
        command: "python obsidian_discord_bot.py"
        description: "Obsidian Discord bot"
      - name: "obsidian_hub"
        command: "python obsidian_integration_hub.py"
        description: "Obsidian integration hub"
      - name: "gl2discord"
        command: "./gl2discord.sh"
        description: "GitLens to Discord bridge"

  - name: "Monitoring & Status"
    icon: "📊"
    items:
      - name: "status_check"
        command: "./status-check.sh"
        description: "System status check"
      - name: "harbor_watch"
        command: "./watch_harbor.sh"
        description: "Harbor registry monitoring"
      - name: "performance_oracle"
        command: "python strategic_performance_oracle.py"
        description: "Strategic performance analysis"
      - name: "benchmarks"
        command: "python scripts/run_benchmarks.py"
        description: "Run system benchmarks"

  - name: "Configuration & Utilities"
    icon: "⚙️"
    items:
      - name: "validate_config"
        command: "./validate-config.sh"
        description: "Validate configuration files"
      - name: "state_sync"
        command: "python state_sync_cli.py"
        description: "State synchronization CLI"
      - name: "reflexshell"
        command: "python reflexshell_layout.py"
        description: "Reflex shell interface"
      - name: "dao_record"
        command: "./generate_dao_record.sh"
        description: "Generate DAO record"

  - name: "Development & Build"
    icon: "🔧"
    items:
      - name: "start_cloudos"
        command: "./start-cloudos-jdk.sh start"
        description: "Start CloudOS JDK workspace"
      - name: "jdk_solver"
        command: "./jdk-solver.sh"
        description: "JDK version solver"
      - name: "mastery_drills"
        command: "./mastery-drills.sh"
        description: "Run mastery drills"
      - name: "contradiction_engine"
        command: "./contradiction-engine.sh"
        description: "Contradiction analysis engine"
