# LLM Port Assignments and Configuration
# Sovereign Cognitive Architecture
# Version: 1.0.0

metadata:
  title: "LLM Listening Ports Configuration"
  description: "Standardized port assignments for universal LLM integration"
  version: "1.0.0"
  last_updated: "2025-12-07"

# ============================================================================
# STANDARD PORT MAPPING
# ============================================================================
# All LLMs operate as microservices with standardized HTTP/REST endpoints
# This enables hot-swapping, load balancing, and zero vendor lock-in

ports:
  # Anthropic Claude
  claude:
    port: 8001
    service_name: "claude-api"
    protocol: "HTTP/REST"
    health_endpoint: "/health"
    api_base: "https://api.anthropic.com/v1"
    
    models:
      primary: "claude-3-5-sonnet-20241022"
      alternatives:
        - "claude-3-opus-20240229"
        - "claude-3-sonnet-20240229"
        - "claude-3-haiku-20240307"
        
    capabilities:
      - "long_context"          # 200K tokens
      - "code_generation"       # Strong coding abilities
      - "reasoning"             # Chain-of-thought
      - "function_calling"      # Tool use
      - "vision"                # Image analysis (3.5 Sonnet)
      
    config:
      max_tokens: 8192
      temperature: 1.0
      top_p: 1.0
      timeout_seconds: 120
      retry_attempts: 3
      
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ANTHROPIC_BASE_URL: "https://api.anthropic.com/v1"
      
    memory_mesh_integration: true
    quadrilateral_validation: true

  # OpenAI GPT
  gpt:
    port: 8002
    service_name: "gpt-api"
    protocol: "HTTP/REST"
    health_endpoint: "/health"
    api_base: "https://api.openai.com/v1"
    
    models:
      primary: "gpt-4-turbo-preview"
      alternatives:
        - "gpt-4"
        - "gpt-4-vision-preview"
        - "gpt-3.5-turbo"
        
    capabilities:
      - "reasoning"             # Strong analytical skills
      - "vision"                # GPT-4V image understanding
      - "function_calling"      # Native tool support
      - "json_mode"             # Structured outputs
      - "code_interpreter"      # Execute Python
      
    config:
      max_tokens: 8192
      temperature: 1.0
      top_p: 1.0
      timeout_seconds: 120
      retry_attempts: 3
      
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_BASE_URL: "https://api.openai.com/v1"
      
    memory_mesh_integration: true
    quadrilateral_validation: true

  # Local Ollama
  ollama:
    port: 11434
    service_name: "ollama"
    protocol: "HTTP/REST"
    health_endpoint: "/api/tags"
    api_base: "http://localhost:11434"
    
    models:
      available:
        - name: "llama3"
          size: "8B"
          quantization: "Q4_K_M"
        - name: "mistral"
          size: "7B"
          quantization: "Q4_K_M"
        - name: "codellama"
          size: "7B"
          quantization: "Q4_K_M"
        - name: "phi3"
          size: "3.8B"
          quantization: "Q4_K_M"
        - name: "gemma2"
          size: "9B"
          quantization: "Q4_K_M"
          
    capabilities:
      - "local_inference"       # No API calls
      - "privacy_preserving"    # Data never leaves machine
      - "offline_capable"       # No internet required
      - "customizable"          # Fine-tuning support
      - "cost_free"             # Zero API costs
      
    config:
      num_ctx: 4096             # Context window
      num_gpu: 1                # GPU layers
      temperature: 0.8
      timeout_seconds: 180      # Local inference can be slower
      
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODELS: "/root/.ollama/models"
      
    memory_mesh_integration: true
    quadrilateral_validation: true

  # Alibaba Qwen
  qwen:
    port: 8003
    service_name: "qwen-api"
    protocol: "HTTP/REST"
    health_endpoint: "/health"
    api_base: "https://dashscope.aliyuncs.com/api/v1"
    
    models:
      primary: "qwen-max"
      alternatives:
        - "qwen-plus"
        - "qwen-turbo"
        - "qwen-vl-max"         # Vision model
        
    capabilities:
      - "multilingual"          # Strong Chinese support
      - "reasoning"             # Analytical capabilities
      - "long_context"          # Extended context window
      - "vision"                # Image understanding (VL models)
      
    config:
      max_tokens: 8192
      temperature: 1.0
      top_p: 1.0
      timeout_seconds: 120
      retry_attempts: 3
      
    environment:
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY}"
      DASHSCOPE_BASE_URL: "https://dashscope.aliyuncs.com/api/v1"
      
    memory_mesh_integration: true
    quadrilateral_validation: true

  # Custom/Extensible Slot
  custom:
    port: 8004
    service_name: "custom-llm"
    protocol: "HTTP/REST"
    health_endpoint: "/health"
    api_base: "http://localhost:8004"
    description: "Extensible slot for additional LLM providers"
    
    examples:
      - "Cohere Command-R"
      - "Mistral API"
      - "Together.ai"
      - "Replicate"
      - "Hugging Face Inference"
      - "Self-hosted models"
      
    capabilities:
      - "user_defined"
      
    config:
      max_tokens: 8192
      temperature: 1.0
      timeout_seconds: 120
      
    memory_mesh_integration: true
    quadrilateral_validation: true

# ============================================================================
# INFRASTRUCTURE PORTS
# ============================================================================

infrastructure:
  memory_mesh:
    port: 7000
    service_name: "memory-api"
    protocol: "HTTP/REST"
    description: "Unified context and memory interface"
    endpoints:
      - "/conversations"        # Store/retrieve conversations
      - "/retrieve"             # Vector similarity search
      - "/export"               # Sovereign data export
      - "/sync"                 # Cross-LLM synchronization
      - "/health"               # Health check
      
  qdrant:
    port: 6333
    grpc_port: 6334
    service_name: "qdrant"
    protocol: "HTTP/gRPC"
    description: "Vector database for embeddings"
    
  redis:
    port: 6379
    service_name: "redis"
    protocol: "Redis Protocol"
    description: "Fast K/V cache for sessions and metadata"

# ============================================================================
# PROXY CONFIGURATION
# ============================================================================
# Each LLM gets a local proxy that handles:
# - Memory mesh integration
# - Quadrilateral verification
# - Rate limiting
# - Retries and fallbacks
# - Audit logging

proxy_settings:
  enable_caching: true
  cache_ttl_seconds: 3600
  
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_size: 10
    
  retry_policy:
    max_attempts: 3
    backoff_strategy: "exponential"
    initial_delay_ms: 1000
    max_delay_ms: 30000
    
  fallback_chain:
    enabled: true
    order:
      - "claude"
      - "gpt"
      - "ollama"
    failure_threshold: 3
    
  audit_logging:
    enabled: true
    log_requests: true
    log_responses: true
    log_errors: true
    log_latency: true

# ============================================================================
# LOAD BALANCING
# ============================================================================
# For production deployments with multiple instances

load_balancing:
  enabled: false
  strategy: "round_robin"  # round_robin | least_connections | weighted
  
  instances:
    claude:
      - host: "localhost"
        port: 8001
        weight: 1
    gpt:
      - host: "localhost"
        port: 8002
        weight: 1
    ollama:
      - host: "localhost"
        port: 11434
        weight: 1

# ============================================================================
# MONITORING
# ============================================================================

monitoring:
  prometheus:
    enabled: true
    port: 9090
    metrics:
      - "llm_requests_total"
      - "llm_request_duration_seconds"
      - "llm_errors_total"
      - "llm_tokens_used"
      - "memory_mesh_operations_total"
      
  health_checks:
    interval_seconds: 30
    timeout_seconds: 10
    failure_threshold: 3
    
  alerts:
    - name: "LLM Service Down"
      condition: "health_check_failures >= 3"
      severity: "critical"
      
    - name: "High Error Rate"
      condition: "error_rate > 0.05"
      severity: "warning"
      
    - name: "Slow Response Time"
      condition: "p95_latency > 10s"
      severity: "warning"

# ============================================================================
# DEPLOYMENT EXAMPLES
# ============================================================================

deployment_examples:
  docker_compose: |
    version: '3.8'
    services:
      claude-api:
        image: sovereign-cognitive/claude-proxy:latest
        ports:
          - "8001:8001"
        environment:
          - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          
      gpt-api:
        image: sovereign-cognitive/gpt-proxy:latest
        ports:
          - "8002:8002"
        environment:
          - OPENAI_API_KEY=${OPENAI_API_KEY}
          
      ollama:
        image: ollama/ollama:latest
        ports:
          - "11434:11434"
        volumes:
          - ollama_models:/root/.ollama
          
  kubernetes: |
    apiVersion: v1
    kind: Service
    metadata:
      name: claude-api
    spec:
      selector:
        app: claude-api
      ports:
        - port: 8001
          targetPort: 8001

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

usage_examples:
  query_claude: |
    curl -X POST http://localhost:8001/chat \
      -H "Content-Type: application/json" \
      -d '{
        "model": "claude-3-5-sonnet-20241022",
        "messages": [{"role": "user", "content": "Hello!"}],
        "max_tokens": 1024
      }'
      
  query_gpt: |
    curl -X POST http://localhost:8002/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
        "model": "gpt-4-turbo-preview",
        "messages": [{"role": "user", "content": "Hello!"}]
      }'
      
  query_ollama: |
    curl -X POST http://localhost:11434/api/generate \
      -H "Content-Type: application/json" \
      -d '{
        "model": "llama3",
        "prompt": "Hello!",
        "stream": false
      }'
      
  memory_mesh_sync: |
    # Store conversation
    curl -X POST http://localhost:7000/conversations \
      -H "Content-Type: application/json" \
      -d '{
        "llm_provider": "claude",
        "messages": [...]
      }'
      
    # Retrieve context
    curl -X GET "http://localhost:7000/retrieve?query=quantum+computing&k=5"

# ============================================================================
# SECURITY
# ============================================================================

security:
  api_keys:
    storage: "environment_variables"  # environment_variables | vault | secrets_manager
    rotation_policy: "90_days"
    
  tls:
    enabled: false  # Enable for production
    cert_path: "/etc/certs/tls.crt"
    key_path: "/etc/certs/tls.key"
    
  firewall:
    allowed_ips:
      - "127.0.0.1"
      - "::1"
    deny_by_default: false  # Set true for production

