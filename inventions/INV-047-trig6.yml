  architecture:
    agent_count: 3
    consensus_model: "Weighted multi-agent voting"
    
    agents:
      - name: "Ratio"
        role: "Logic & Reason"
        focus: "Logical consistency, efficiency, optimization"
        
      - name: "Empathy"
        role: "Human Impact"
        focus: "Emotional impact, human wellbeing, social effects"
        
      - name: "Chaos"
        role: "Edge Case Detection"
        focus: "Adversarial thinking, failure modes, unintended consequences"
        
  fitness_function:
    formula: "f = R × (1-D) × (1-N) × eq"
    components:
      R: "Reward (positive outcome)"
      D: "Danger score (0-1 normalized)"
      N: "Narcissism/self-serving score (0-1)"
      eq: "Equilibrium term"
    danger_threshold: 10
    
  love_invariant:
    description: "Three immutable principles that constrain all AI decision-making"
    principles:
      L1:
        name: "No harm optimization"
        rule: "Never optimize toward harming humans"
        enforcement: "Hard constraint in fitness function"
        
      L2:
        name: "Uncomfortable truths"
        rule: "Speak truth even when it hurts"
        enforcement: "Honesty requirement in all outputs"
        
      L3:
        name: "Double stress test"
        rule: "All decisions survive multi-angle attack"
        enforcement: "Mandatory review by all three agents"
        
