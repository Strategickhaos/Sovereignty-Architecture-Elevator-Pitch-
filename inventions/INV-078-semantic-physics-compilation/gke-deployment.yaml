apiVersion: v1
kind: Namespace
metadata:
  name: flamelang-physics
  labels:
    app: flamelang
    component: physics-compiler
    invention: INV-078

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flamelang-physics-config
  namespace: flamelang-physics
data:
  hebrew_operators.json: |
    {
      "CREATE": "ברא",
      "SEPARATE": "בדל",
      "CONNECT": "חבר",
      "TRANSFORM": "הפך",
      "CONSTRAIN": "גבל",
      "OBSERVE": "ראה",
      "RADIATE": "אור",
      "EXPAND": "רחב",
      "SUPPRESS": "כבש",
      "BOUNCE": "דחה",
      "HARMONIZE": "שוה",
      "FLUCTUATE": "נוע",
      "UNIFY": "אחד"
    }
  
  dna_constraints.json: |
    {
      "AUG": "ENERGY_CONSERVATION",
      "UGA": "MOMENTUM_CONSERVATION",
      "UAA": "CHARGE_CONSERVATION",
      "UAG": "ANGULAR_MOMENTUM_CONSERVATION"
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flamelang-physics-compiler
  namespace: flamelang-physics
  labels:
    app: flamelang
    component: physics-compiler
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flamelang
      component: physics-compiler
  template:
    metadata:
      labels:
        app: flamelang
        component: physics-compiler
    spec:
      containers:
      - name: physics-compiler
        image: gcr.io/jarvis-swarm-personal/flamelang-physics:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: FLAMELANG_MODE
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: flamelang-physics-config

---
apiVersion: v1
kind: Service
metadata:
  name: flamelang-physics-service
  namespace: flamelang-physics
  labels:
    app: flamelang
    component: physics-compiler
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: flamelang
    component: physics-compiler

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flamelang-physics-ingress
  namespace: flamelang-physics
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - flamelang.strategickhaos.ai
    secretName: flamelang-tls
  rules:
  - host: flamelang.strategickhaos.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flamelang-physics-service
            port:
              number: 80

---
apiVersion: batch/v1
kind: Job
metadata:
  name: cmb-anomaly-analysis
  namespace: flamelang-physics
  labels:
    app: flamelang
    component: cmb-analyzer
spec:
  template:
    metadata:
      labels:
        app: flamelang
        component: cmb-analyzer
    spec:
      containers:
      - name: analyzer
        image: gcr.io/jarvis-swarm-personal/flamelang-physics:latest
        command: ["python3", "/app/cmb_anomaly_detector.py"]
        env:
        - name: PLANCK_DATA_PATH
          value: "/data/planck_2018"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      restartPolicy: OnFailure
  backoffLimit: 3

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: physics-models-pvc
  namespace: flamelang-physics
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flamelang-physics-hpa
  namespace: flamelang-physics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flamelang-physics-compiler
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
