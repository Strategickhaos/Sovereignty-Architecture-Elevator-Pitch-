  description: "Hardware-software bridge mapping system dynamics to General Relativity metrics"

inventory:
  hardware:
    potentiometer:
      part_number: "Bourns PTV09A"
      resistance: "10kΩ linear"
      purpose: "Manual r or θ parameter adjustment for GR metrics"
      status: "described"
      integration: "Arduino A0 pin via serial"
    
    microcontroller:
      options:
        - name: "Arduino Uno"
          interface: "USB Serial"
          adc_pins: "A0-A5"
          status: "compatible"
        - name: "Raspberry Pi Pico"
          interface: "USB Serial"
          adc_pins: "GP26-GP28"
          status: "compatible"
      purpose: "Read potentiometer analog values (0-1023)"
    
    voltage_sensor:
      part_number: "INA219"
      interface: "I2C"
      purpose: "Real-time voltage/current monitoring for command power analysis"
      status: "planned"
      features:
        - "±3.2A current sensing"
        - "0-26V voltage sensing"
        - "High precision ADC"
    
    fan_sensor:
      linux:
        method: "lm-sensors"
        package: "lm-sensors"
        command: "sensors"
        status: "available"
      windows:
        method: "OpenHardwareMonitor"
        library: "OpenHardwareMonitorLib.dll"
        language: "C# / Python.NET"
        status: "available"
      purpose: "Real fan RPM for angular velocity proxy (ϕ terms)"
    
    cables_and_connectors:
      - "USB A to B cable (Arduino)"
      - "Jumper wires (M-M, M-F)"
      - "Breadboard (optional)"
      - "Voltage probe leads (for INA219)"

  software:
    python:
      version: "3.12+"
      dependencies:
        core:
          - package: "psutil"
            version: ">=5.9.0"
            purpose: "System and process monitoring (CPU, memory)"
            status: "installed"
          - package: "sympy"
            version: ">=1.12"
            purpose: "Symbolic mathematics for GR metrics"
            status: "required"
        hardware:
          - package: "pyserial"
            version: ">=3.5"
            purpose: "Arduino serial communication"
            status: "optional"
          - package: "pysensors"
            version: ">=0.0.4"
            purpose: "Linux sensor reading (lm-sensors wrapper)"
            status: "optional"
        visualization:
          - package: "matplotlib"
            version: ">=3.7.0"
            purpose: "Plot geodesic analogs and ds² visualization"
            status: "optional"
    
    flamelang:
      integration: "FlameLang type system opcodes"
      mappings:
        - type: "Frequency"
          opcode: "0x35"
          hardware_source: "fan_rpm"
        - type: "Energy"
          opcode: "0x2F"
          hardware_source: "voltage_approx"
        - type: "Wave"
          opcode: "0x3E"
          hardware_source: "cpu_freq_mhz"
        - type: "Qubit"
          opcode: "0x29"
          hardware_source: "mem_percent"
    
    operating_systems:
      linux:
        tools:
          - "lm-sensors (fan/temp monitoring)"
          - "/sys/class/hwmon/* (kernel sensors)"
          - "i2c-tools (INA219 setup)"
        status: "preferred"
      windows:
        tools:
          - "OpenHardwareMonitor"
          - "wmi (Windows Management Instrumentation)"
          - "psutil (cross-platform)"
        status: "supported"

hardware_hookup:
  potentiometer_wiring:
    connections:
      - pin: "VCC"
        to: "5V (Arduino)"
        color: "red"
      - pin: "GND"
        to: "GND (Arduino)"
        color: "black"
      - pin: "Wiper"
        to: "A0 (Arduino)"
        color: "yellow"
    notes:
      - "Use shielded cable if cable length > 6 inches to reduce noise"
      - "Add 0.1µF capacitor across VCC-GND for noise filtering (optional)"
  
  ina219_wiring:
    connections:
      - pin: "VCC"
        to: "3.3V or 5V"
      - pin: "GND"
        to: "GND"
      - pin: "SDA"
        to: "SDA (I2C data)"
      - pin: "SCL"
        to: "SCL (I2C clock)"
      - pin: "VIN+"
        to: "Power rail to measure"
      - pin: "VIN-"
        to: "Load ground"
    i2c_address: "0x40 (default)"
    notes:
      - "Requires i2c-tools package on Linux"
      - "Use Adafruit_INA219 library for easy Python integration"

  arduino_code:
    description: "Simple ADC reader for potentiometer"
    code: |
      // Arduino sketch for potentiometer reading
      void setup() {
        Serial.begin(9600);
      }
      
      void loop() {
        int pot_value = analogRead(A0);
        Serial.println(pot_value);
        delay(100);  // 10 Hz sampling
      }
    upload: "Use Arduino IDE to upload sketch"

