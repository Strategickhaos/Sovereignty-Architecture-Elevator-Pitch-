practice_questions:
  - q: "A Cloud Run service has --min-instances=0. What ERU variance does this introduce?"
    a: "Cold start temporal variance — first request P99 spikes to 3–8s. Remedy: min-instances=1 for latency-critical pads."

  - q: "You need to give a Cloud Run service access to Cloud SQL. Least-privilege approach?"
    a: "Create dedicated SA, grant roles/cloudsql.client only, mount via Workload Identity. Never use Editor."

  - q: "GKE cluster shows STATUS=PROVISIONING for 15 minutes. ERU analysis?"
    a: "Expected: RUNNING in 5 min. Reality: PROVISIONING. Variance: quota exhaustion or zone capacity. Remedy: check quota, try different zone."

  - q: "How does SAGCO district model map to GKE namespaces?"
    a: "Namespace = District. NetworkPolicy = district gate. ResourceQuota = energy budget. ServiceAccount = citizen identity."
