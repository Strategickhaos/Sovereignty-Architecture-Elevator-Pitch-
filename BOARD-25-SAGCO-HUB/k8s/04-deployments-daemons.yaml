---
# sagco-daemon-observer — telemetry (high CPU: 54.88%, 242MB)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sagco-daemon-observer
  namespace: sagco-industrial
  labels:
    sagco.daemon: observer
    sagco.district: industrial
    sagco.team: purple
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sagco-daemon-observer
  template:
    metadata:
      labels:
        app: sagco-daemon-observer
        sagco.daemon: observer
    spec:
      imagePullSecrets:
        - name: sagco-hub-pull
      containers:
        - name: observer
          image: sagco-controls-v2:latest
          envFrom:
            - configMapRef:
                name: sagco-daemon-config
            - configMapRef:
                name: sagco-os-config
          env:
            - name: DAEMON_ROLE
              value: telemetry_observer
            - name: DAEMON_NAME
              value: sagco-daemon-observer
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          volumeMounts:
            - name: reports
              mountPath: /sagco/reports
            - name: data
              mountPath: /sagco/data
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: sagco-reports-pvc
        - name: data
          persistentVolumeClaim:
            claimName: sagco-data-pvc
