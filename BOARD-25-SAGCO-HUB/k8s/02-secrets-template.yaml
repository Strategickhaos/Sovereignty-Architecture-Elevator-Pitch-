---
# SAGCO Trinity Vault — Secrets (trinity district)
# ⚠  TEMPLATE ONLY — replace <base64_encoded_value> before applying
# Generate:  echo -n "value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: sagco-core-secrets
  namespace: sagco-trinity
  labels:
    sagco.district: trinity
    sagco.board: BOARD-25-SAGCO-HUB
    sagco.kind: trinity_vault
type: Opaque
data:
  # Docker registry pull secret (for sagco-os, sagco-controls-v2)
  SAGCO_REGISTRY_USER:    <base64_encoded_value>
  SAGCO_REGISTRY_TOKEN:   <base64_encoded_value>

  # GCP Service Account key (for gke_mapper.py, recon_cloud.py)
  GCP_SA_KEY_JSON:        <base64_encoded_value>

  # SAGCO citizen registry signing key
  SAGCO_GENESIS_KEY:      <base64_encoded_value>

  # MCP server auth token
  MCP_AUTH_TOKEN:         <base64_encoded_value>

  # Discord webhook (for antibody alerts)
  DISCORD_WEBHOOK_URL:    <base64_encoded_value>

  # GitHub token (for CI, PR operations)
  GITHUB_TOKEN:           <base64_encoded_value>
---
# Docker Hub pull secret for sagco images
# Apply with: kubectl create secret docker-registry sagco-hub-pull \
#   --docker-server=registry.hub.docker.com \
#   --docker-username=dom101 \
#   --docker-password=<token> \
#   -n sagco-genesis
apiVersion: v1
kind: Secret
metadata:
  name: sagco-hub-pull
  namespace: sagco-genesis
  labels:
    sagco.district: genesis
    sagco.kind: registry_pull_secret
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64_encoded_dockerconfig>
---
# Local registry pull secret (sagco-registry at 5000:5000)
apiVersion: v1
kind: Secret
metadata:
  name: sagco-local-registry-pull
  namespace: sagco-genesis
  labels:
    sagco.district: genesis
    sagco.kind: local_registry
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64_encoded_dockerconfig>
