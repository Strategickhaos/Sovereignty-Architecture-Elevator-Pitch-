---
# SAGCO Reports volume — memory_palace (39GB)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sagco-reports-pvc
  namespace: sagco-eru
  labels:
    sagco.district: memory_palace
    sagco.volume: mobiledevices_sagco-reports
    sagco.size: 39GB
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 39Gi
---
# SAGCO Data volume — industrial (7.8MB active)
apiVersion: v1
