---
apiVersion: v1
kind: Namespace
metadata:
  name: ctf-tools
  labels:
    name: ctf-tools
    purpose: penetration-testing

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ctf-brain-config
  namespace: ctf-tools
data:
  OLLAMA_HOST: "http://localhost:11434"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctf-brain
  namespace: ctf-tools
  labels:
    app: ctf-brain
    component: orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctf-brain
  template:
    metadata:
      labels:
        app: ctf-brain
        component: orchestration
    spec:
      containers:
      - name: ctf-brain
        image: ghcr.io/strategickhaos/ctf-brain:latest
        imagePullPolicy: Always
        command: ["python", "/app/main.py"]
        envFrom:
        - configMapRef:
            name: ctf-brain-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netcat-proxy
  namespace: ctf-tools
  labels:
    app: netcat-proxy
    component: network-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netcat-proxy
  template:
    metadata:
      labels:
        app: netcat-proxy
        component: network-ops
    spec:
      containers:
      - name: netcat-proxy
        image: ghcr.io/strategickhaos/ctf-brain:latest
        imagePullPolicy: Always
        command: ["python", "/app/netcat_proxy.py"]
        ports:
        - containerPort: 4444
          name: reverse-shell
          protocol: TCP
        - containerPort: 8080
          name: relay
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: netcat-proxy
  namespace: ctf-tools
  labels:
    app: netcat-proxy
spec:
  type: LoadBalancer
  selector:
    app: netcat-proxy
  ports:
  - name: reverse-shell
    port: 4444
    targetPort: 4444
    protocol: TCP
  - name: relay
    port: 8080
    targetPort: 8080
    protocol: TCP

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-tools-reader
  namespace: ctf-tools
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-tools-reader-binding
  namespace: ctf-tools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ctf-tools-reader
subjects:
- kind: ServiceAccount
  name: default
  namespace: ctf-tools

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ctf-tools-network-policy
  namespace: ctf-tools
spec:
  podSelector:
    matchLabels:
      component: orchestration
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ctf-tools
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 11434
