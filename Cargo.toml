[workspace]
members = [
    "crates/sagco-guardian",
    "crates/sagco-dom0d",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Strategickhaos DAO LLC"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
