version: '3.8'

services:
  node_exporter:
    image: prom/node-exporter:latest
    container_name: bench_node_exporter
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    restart: unless-stopped
    network_mode: host

  prometheus_scraper:
    image: prom/prometheus:latest
    container_name: bench_prometheus_scraper
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./log.jsonl:/bench/sensors/prom_node_exporter/log.jsonl
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
